<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Linh Thú Ký — Hành Trình Thu Phục</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(circle at 50% -10%,#1d2748 0%,#0b0f1c 55%,#04050a 100%);
    font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:#eef2ff;display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:10px;overflow:hidden;
  }
  #stage{
    position:relative;
    width:min(1120px,100%,calc((100vh - 20px) * 16 / 9));
    aspect-ratio:16/9;
    border-radius:22px;overflow:hidden;
    box-shadow:0 40px 100px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.09),0 0 90px rgba(80,140,255,.12);
    background:#0e1428;isolation:isolate;
  }
  canvas{display:block;width:100%;height:100%}

  /* ---------- INFO BOXES ---------- */
  .info{
    position:absolute;width:35%;min-width:170px;
    background:linear-gradient(135deg,rgba(10,16,34,.9),rgba(22,31,60,.8));
    border:1.5px solid rgba(255,255,255,.17);
    border-radius:15px;padding:8px 13px 9px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);
    transition:opacity .3s,transform .3s;
  }
  .info.enemy{left:3.2%;top:5%}
  .info.player{right:3.2%;bottom:29.5%}
  .info.hidden{opacity:0;transform:translateY(-8px);pointer-events:none}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .nm{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(12px,1.5vw,18px);
      letter-spacing:.3px;text-shadow:0 2px 6px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lv{font-weight:900;font-size:clamp(10px,1.1vw,13px);color:#ffd86b;
      background:rgba(255,200,60,.13);border:1px solid rgba(255,200,60,.3);
      padding:1px 7px;border-radius:20px;flex-shrink:0}
  .bar{height:clamp(6px,.85vw,9px);border-radius:6px;background:rgba(0,0,0,.55);
       margin:6px 0 5px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.8);
       border:1px solid rgba(255,255,255,.07)}
  .fill{height:100%;width:100%;border-radius:6px;
        background:linear-gradient(90deg,#4be08a,#22b95c);
        transition:width .55s cubic-bezier(.22,.8,.3,1),background .4s;
        box-shadow:0 0 10px rgba(80,230,140,.5)}
  .sub{margin-top:1px}
  .badge{font-size:clamp(9px,.95vw,11.5px);font-weight:900;letter-spacing:.6px;
         padding:2px 9px;border-radius:20px;text-transform:uppercase;
         border:1px solid rgba(255,255,255,.25);color:#fff;
         text-shadow:0 1px 3px rgba(0,0,0,.55)}
  .hpn{font-size:clamp(10px,1.05vw,13px);font-weight:800;color:#c9d3ee;
       font-variant-numeric:tabular-nums}
  .xpbar{height:4px;border-radius:4px;background:rgba(0,0,0,.5);margin-top:5px;
         overflow:hidden;border:1px solid rgba(255,255,255,.06)}
  .xpfill{height:100%;width:0;border-radius:4px;
          background:linear-gradient(90deg,#5cc8ff,#3a7bff);
          transition:width .5s cubic-bezier(.22,.8,.3,1);box-shadow:0 0 8px rgba(90,180,255,.6)}

  /* ---------- BOTTOM PANEL ---------- */
  #panel{
    position:absolute;left:0;right:0;bottom:0;
    padding:16px 18px 18px;
    background:linear-gradient(to top,rgba(4,7,16,.97) 35%,rgba(4,7,16,.82) 68%,rgba(4,7,16,0));
    display:flex;flex-direction:column;gap:11px;justify-content:flex-end;
    min-height:26%;
  }
  #msg{
    font-size:clamp(12.5px,1.55vw,19px);font-weight:800;line-height:1.35;
    letter-spacing:.2px;text-shadow:0 2px 10px rgba(0,0,0,.8);
    min-height:1.35em;transition:opacity .18s,transform .18s;
    font-family:'Baloo 2','Nunito',sans-serif;
  }
  #msg.pop{animation:msgpop .3s ease}
  @keyframes msgpop{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
  #menu{display:grid;gap:9px}
  #menu.g4{grid-template-columns:repeat(4,1fr)}
  #menu.g2{grid-template-columns:repeat(2,1fr)}
  #menu.g3{grid-template-columns:repeat(3,1fr)}

  .btn{
    position:relative;border:1.5px solid rgba(255,255,255,.18);
    background:linear-gradient(180deg,rgba(66,82,132,.92),rgba(31,41,72,.92));
    color:#eef2ff;border-radius:13px;padding:10px 12px;
    font-family:'Baloo 2',sans-serif;font-weight:800;
    font-size:clamp(11px,1.35vw,16.5px);cursor:pointer;overflow:hidden;
    transition:transform .13s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,filter .2s;
    box-shadow:0 5px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.16);
    text-shadow:0 2px 5px rgba(0,0,0,.5);line-height:1.15;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    min-height:clamp(38px,4.6vw,58px);
  }
  .btn small{font-size:.72em;font-weight:700;opacity:.82;letter-spacing:.3px}
  .btn:hover{transform:translateY(-3px);filter:brightness(1.16);box-shadow:0 8px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2)}
  .btn:active{transform:translateY(1px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
  .btn::after{content:'';position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 55%);pointer-events:none}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;filter:grayscale(.5)}
  .btn.danger{background:linear-gradient(180deg,rgba(180,60,70,.92),rgba(110,28,40,.92))}
  .btn.gold{background:linear-gradient(180deg,rgba(210,160,40,.95),rgba(140,95,15,.95))}
  .btn.ghost{background:linear-gradient(180deg,rgba(60,66,88,.8),rgba(30,34,48,.8))}

  /* ---------- OVERLAY ---------- */
  #overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;text-align:center;
    background:radial-gradient(circle at 50% 40%,rgba(20,30,60,.72),rgba(3,5,12,.94));
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    z-index:20;padding:20px;transition:opacity .5s;
  }
  #overlay.gone{opacity:0;pointer-events:none}
  #overlay h1{
    font-family:'Baloo 2',sans-serif;font-size:clamp(28px,5.2vw,62px);font-weight:800;
    letter-spacing:1px;line-height:1.05;
    background:linear-gradient(180deg,#fff3c4 0%,#ffb347 45%,#ff6a3d 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 18px rgba(255,140,60,.45));
  }
  #overlay p{font-size:clamp(12px,1.5vw,17px);color:#a9b6da;font-weight:700;max-width:560px;line-height:1.55}
  #overlay .big{
    font-family:'Baloo 2',sans-serif;font-size:clamp(15px,1.9vw,22px);font-weight:800;
    padding:12px 42px;border-radius:16px;cursor:pointer;border:none;color:#25180a;
    background:linear-gradient(180deg,#ffe07a,#ffb02e);
    box-shadow:0 8px 0 #b96f00,0 14px 34px rgba(255,160,40,.4);
    transition:transform .13s cubic-bezier(.3,1.6,.5,1);
  }
  #overlay .big:hover{transform:translateY(-3px)}
  #overlay .big:active{transform:translateY(3px);box-shadow:0 4px 0 #b96f00}

  #starters{display:flex;gap:clamp(8px,1.5vw,18px);flex-wrap:wrap;justify-content:center}
  .card{
    width:clamp(88px,12vw,140px);border-radius:16px;padding:10px 8px 12px;cursor:pointer;
    background:linear-gradient(180deg,rgba(40,52,88,.92),rgba(18,24,44,.92));
    border:2px solid rgba(255,255,255,.14);transition:transform .18s,border-color .2s,box-shadow .2s;
    display:flex;flex-direction:column;align-items:center;gap:5px;
  }
  .card:hover{transform:translateY(-6px) scale(1.03);border-color:rgba(255,255,255,.5);
    box-shadow:0 14px 34px rgba(0,0,0,.55)}
  .card canvas{width:74px;height:74px;image-rendering:auto}
  .card .cn{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(11px,1.2vw,15px)}
  .card .ct{font-size:10px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;
    padding:2px 9px;border-radius:20px;color:#fff}

  /* ---------- HUD TOP ---------- */
  #topbar{position:absolute;top:2.6%;right:3%;display:flex;gap:8px;z-index:5}
  .chip{
    display:flex;align-items:center;gap:6px;
    background:rgba(8,12,26,.8);border:1.5px solid rgba(255,255,255,.14);
    border-radius:20px;padding:4px 12px 4px 8px;font-weight:900;
    font-size:clamp(10px,1.1vw,13.5px);backdrop-filter:blur(10px);color:#dfe7ff;
  }
  .chip .dot{width:11px;height:11px;border-radius:50%;box-shadow:0 0 9px currentColor}
  .iconbtn{
    background:rgba(8,12,26,.8);border:1.5px solid rgba(255,255,255,.14);color:#dfe7ff;
    border-radius:50%;width:clamp(28px,3vw,36px);height:clamp(28px,3vw,36px);
    cursor:pointer;font-size:clamp(12px,1.3vw,16px);backdrop-filter:blur(10px);
    display:flex;align-items:center;justify-content:center;transition:transform .15s,filter .2s;
  }
  .iconbtn:hover{transform:scale(1.1);filter:brightness(1.25)}

  #fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;
        transition:opacity .45s;z-index:15}
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene"></canvas>

  <div id="topbar">
    <div class="chip" id="chipPoke"><span class="dot" style="background:#ee3b3b;color:#ee3b3b"></span><span id="cntPoke">8</span></div>
    <div class="chip" id="chipGreat"><span class="dot" style="background:#3b6fee;color:#3b6fee"></span><span id="cntGreat">4</span></div>
    <div class="chip" id="chipUltra"><span class="dot" style="background:#f0c419;color:#f0c419"></span><span id="cntUltra">2</span></div>
    <button class="iconbtn" id="btnMute" title="Âm thanh">🔊</button>
  </div>

  <div class="info enemy hidden" id="eInfo">
    <div class="row"><span class="nm" id="eName">???</span><span class="lv" id="eLv">Lv.?</span></div>
    <div class="bar"><div class="fill" id="eHpFill"></div></div>
    <div class="row sub"><span class="badge" id="eType">--</span><span class="hpn" id="eHpNum">--/--</span></div>
  </div>

  <div class="info player hidden" id="pInfo">
    <div class="row"><span class="nm" id="pName">???</span><span class="lv" id="pLv">Lv.?</span></div>
    <div class="bar"><div class="fill" id="pHpFill"></div></div>
    <div class="row sub"><span class="badge" id="pType">--</span><span class="hpn" id="pHpNum">--/--</span></div>
    <div class="xpbar"><div class="xpfill" id="pXpFill"></div></div>
  </div>

  <div id="panel">
    <div id="msg"></div>
    <div id="menu"></div>
  </div>

  <div id="fade"></div>

  <div id="overlay">
    <h1>LINH THÚ KÝ</h1>
    <p>Bắt đầu hành trình thu phục những linh thú huyền bí. Chiến đấu, làm suy yếu rồi ném bóng để thu phục chúng!</p>
    <button class="big" id="btnStart">BẮT ĐẦU HÀNH TRÌNH</button>
  </div>
</div>

const $     = id => document.getElementById(id);

function tween(obj, target, dur, ease){
  ease = ease || (p => 1 - Math.pow(1-p, 3));
  return new Promise(res => {
    const from = {}; for (const k in target) from[k] = obj[k];
    const t0 = performance.now();
    function step(now){
      const p = Math.min(1, (now - t0) / dur);
      const e = ease(p);
      for (const k in target) obj[k] = from[k] + (target[k]-from[k])*e;
      if (p < 1) requestAnimationFrame(step); else res();
    }
    requestAnimationFrame(step);
  });
}

function typeEff(a, d){
  const row = CHART[a];
  if (!row) return 1;
  return row[d] === undefined ? 1 : row[d];
}

/* ============================================================
   AUDIO (tiny synth)
   ============================================================ */
let actx = null, muted = false;
function tone(freq, dur, type, vol, slide){
  if (muted) return;
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, actx.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide), actx.currentTime + dur);
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(vol || 0.08, actx.currentTime + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur + 0.03);
  }catch(e){}
}
const sfx = {
  click(){ tone(560, .07, 'triangle', .05); },
  hit(){ tone(180, .16, 'sawtooth', .07, 60); },
  crit(){ tone(320, .25, 'square', .06, 70); },
  faint(){ tone(340, .55, 'sine', .07, 70); },
  throw(){ tone(760, .12, 'triangle', .05, 420); },
  shake(){ tone(300, .07, 'square', .045); },
  catch(){ [660,880,1180,1480].forEach((f,i)=>setTimeout(()=>tone(f,.22,'triangle',.07),i*95)); },
  levelup(){ [520,660,780,1040].forEach((f,i)=>setTimeout(()=>tone(f,.3,'sine',.075),i*110)); },
  run(){ tone(220, .3, 'sine', .05, 700); },
};

const W = 960, H = 540;
const canvas = $('scene');
const ctx = canvas.getContext('2d');
let baseScale = 1;

function resize(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const rect = canvas.getBoundingClientRect();
  canvas.width  = Math.max(2, Math.round(rect.width  * dpr));
  canvas.height = Math.max(2, Math.round(rect.height * dpr));
  baseScale = canvas.width / W;
  ctx.setTransform(baseScale, 0, 0, baseScale, 0, 0);
}
window.addEventListener('resize', resize);

/* ============================================================
   MON FACTORY
   ============================================================ */
function makeMon(key, level){
  const sp = SPECIES[key];
  const hp   = Math.floor(sp.base.hp  * level / 42) + level + 11;
  const atk  = Math.floor(sp.base.atk * level / 42) + 5;
  const def  = Math.floor(sp.base.def * level / 42) + 5;
  const spd  = Math.floor(sp.base.spd * level / 42) + 5;
  return {
    key, sp, level,
    maxHp: hp, hp,
    atk, def, spd,
    moves: sp.moves.slice(),
    xp: 0, xpNext: level * 18,
    seed: Math.random()*100,
  };
}

/* ============================================================
   CREATURE RENDERING
   ============================================================ */
function ell(c,x,y,rx,ry,rot){ c.beginPath(); c.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2); }

function drawFlame(c, x, y, r, t){
  c.save(); c.translate(x,y);
  const cols = ['#ff4d15','#ff9c1f','#ffe27a'];
  for (let i=0;i<3;i++){
    const ph = t*5 + i*1.4;
    const rr = r * (1 - i*0.27);
    const yy = -i*r*0.34 + Math.sin(ph)*r*0.09;
    const xx = Math.sin(ph*0.85)*r*0.14;
    c.beginPath();
    c.moveTo(xx, yy + rr*0.95);
    c.bezierCurveTo(xx - rr*1.05, yy + rr*0.25, xx - rr*0.55, yy - rr*0.55, xx, yy - rr);
    c.bezierCurveTo(xx + rr*0.55, yy - rr*0.55, xx + rr*1.05, yy + rr*0.25, xx, yy + rr*0.95);
    c.fillStyle = cols[i]; c.fill();
  }
  c.restore();
}

function drawLeafShape(c, x, y, len, rot, col, dark){
  c.save(); c.translate(x,y); c.rotate(rot);
  c.beginPath();
  c.moveTo(0,0);
  c.bezierCurveTo(len*0.5, -len*0.45, len*0.95, -len*0.2, len, 0);
  c.bezierCurveTo(len*0.95, len*0.2, len*0.5, len*0.45, 0, 0);
  c.fillStyle = col; c.fill();
  c.strokeStyle = dark; c.lineWidth = Math.max(1,len*0.06); c.stroke();
  c.beginPath(); c.moveTo(len*0.06,0); c.lineTo(len*0.94,0); c.stroke();
  c.restore();
}

function drawSprout(c, s, t){
  const sway = Math.sin(t*1.8)*0.08;
  c.save(); c.translate(0, -s*0.5); c.rotate(sway);
  c.strokeStyle = '#3E8E4C'; c.lineWidth = s*0.035; c.lineCap='round';
  c.beginPath(); c.moveTo(0,0); c.quadraticCurveTo(s*0.03,-s*0.14, 0, -s*0.24); c.stroke();
  drawLeafShape(c, 0, -s*0.2, s*0.26, -2.5, '#63C97B', '#2F7A44');
  drawLeafShape(c, 0, -s*0.24, s*0.22, -0.7, '#7EDD93', '#2F7A44');
  c.restore();
}

function drawBolt(c, s, t){
  const f = 0.6 + Math.abs(Math.sin(t*4))*0.4;
  c.save(); c.translate(0, -s*0.54); c.scale(f, f);
  c.beginPath();
  c.moveTo(-s*0.07, -s*0.22);
  c.lineTo( s*0.10, -s*0.22);
  c.lineTo( s*0.01, -s*0.05);
  c.lineTo( s*0.13, -s*0.05);
  c.lineTo(-s*0.06,  s*0.24);
  c.lineTo( s*0.01,  s*0.03);
  c.lineTo(-s*0.11,  s*0.03);
  c.closePath();
  c.fillStyle = '#FFE34D'; c.fill();
  c.strokeStyle = '#D19A00'; c.lineWidth = s*0.022; c.stroke();
  c.restore();
}

function drawCrystal(c, s, t){
  const pulse = 1 + Math.sin(t*2.4)*0.06;
  c.save(); c.translate(0, -s*0.56); c.scale(pulse, pulse);
  const spikes = [[0,-1,1],[ -0.5,-0.62,0.72],[0.5,-0.62,0.72]];
  for (const [dx,dy,sc] of spikes){
    c.save(); c.translate(dx*s*0.22, dy*s*0.3); c.rotate(dx*0.42);
    c.beginPath();
    c.moveTo(0,-s*0.2*sc); c.lineTo(s*0.075*sc,0);
    c.lineTo(0,s*0.14*sc); c.lineTo(-s*0.075*sc,0);
    c.closePath();
    const g = c.createLinearGradient(0,-s*0.2,0,s*0.14);
    g.addColorStop(0,'#EAFEFF'); g.addColorStop(.5,'#8FE8F2'); g.addColorStop(1,'#48C3D6');
    c.fillStyle = g; c.fill();
    c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = s*0.014; c.stroke();
    c.restore();
  }
  c.restore();
}

function drawHalo(c, s, t){
  const bob = Math.sin(t*1.6)*s*0.03;
  c.save(); c.translate(0, -s*0.58 + bob);
  c.strokeStyle = '#FFE9A8'; c.lineWidth = s*0.05;
  c.shadowColor = '#FFD86B'; c.shadowBlur = s*0.22;
  c.beginPath(); c.ellipse(0, 0, s*0.22, s*0.075, 0, 0, Math.PI*2); c.stroke();
  c.shadowBlur = 0;
  c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = s*0.018;
  c.beginPath(); c.ellipse(0, -s*0.01, s*0.22, s*0.075, 0, 0, Math.PI*2); c.stroke();
  c.restore();
}

function drawEars(c, s, pal, kind, t){
  const stroke = pal.dark, lw = Math.max(1.6, s*0.022);
  c.strokeStyle = stroke; c.lineWidth = lw; c.lineJoin = 'round';
  const fillWith = (path) => { c.fillStyle = pal.body; path(); c.fill(); c.stroke(); };

  if (kind === 'pointy'){
    for (const sg of [-1,1]){
      fillWith(()=>{
        c.beginPath();
        c.moveTo(sg*s*0.15, -s*0.44);
        c.quadraticCurveTo(sg*s*0.42, -s*0.78, sg*s*0.46, -s*0.44);
        c.closePath();
      });
      c.fillStyle = pal.soft;
      c.beginPath();
      c.moveTo(sg*s*0.19, -s*0.46);
      c.quadraticCurveTo(sg*s*0.37, -s*0.68, sg*s*0.40, -s*0.46);
      c.closePath(); c.fill();
    }
  } else if (kind === 'round'){
    for (const sg of [-1,1]){
      fillWith(()=>{ c.beginPath(); c.arc(sg*s*0.30, -s*0.44, s*0.15, 0, Math.PI*2); });
      c.fillStyle = pal.soft;
      c.beginPath(); c.arc(sg*s*0.30, -s*0.44, s*0.08, 0, Math.PI*2); c.fill();
    }
  } else if (kind === 'long'){
    for (const sg of [-1,1]){
      c.save(); c.translate(sg*s*0.20, -s*0.44); c.rotate(sg*0.16 + Math.sin(t*2+sg)*0.045);
      fillWith(()=>{ c.beginPath(); c.ellipse(0, -s*0.24, s*0.095, s*0.30, 0, 0, Math.PI*2); });
      c.fillStyle = pal.soft;
      c.beginPath(); c.ellipse(0, -s*0.22, s*0.05, s*0.20, 0, 0, Math.PI*2); c.fill();
      c.restore();
    }
  } else if (kind === 'fin'){
    for (const sg of [-1,1]){
      fillWith(()=>{
        c.beginPath();
        c.moveTo(sg*s*0.16, -s*0.40);
        c.quadraticCurveTo(sg*s*0.56, -s*0.72, sg*s*0.50, -s*0.34);
        c.quadraticCurveTo(sg*s*0.36, -s*0.30, sg*s*0.16, -s*0.40);
        c.closePath();
      });
    }
  } else if (kind === 'spike'){
    for (const sg of [-1,1]){
      fillWith(()=>{
        c.beginPath();
        c.moveTo(sg*s*0.12, -s*0.42);
        c.lineTo(sg*s*0.34, -s*0.70);
        c.lineTo(sg*s*0.44, -s*0.36);
        c.closePath();
      });
      c.fillStyle = pal.accent;
      c.beginPath();
      c.moveTo(sg*s*0.20, -s*0.44);
      c.lineTo(sg*s*0.33, -s*0.62);
      c.lineTo(sg*s*0.37, -s*0.42);
      c.closePath(); c.fill();
    }
  } else if (kind === 'leaf'){
    for (const sg of [-1,1]){
      c.save(); c.translate(sg*s*0.20, -s*0.42); c.rotate(sg*0.55 + Math.sin(t*2+sg)*0.06);
      drawLeafShape(c, 0, 0, s*0.34, sg>0?0:Math.PI, '#5FCC7A', '#2F7A44');
      c.restore();
    }
  } else if (kind === 'bolt'){
    for (const sg of [-1,1]){
      c.save(); c.translate(sg*s*0.26, -s*0.46); c.scale(sg,1);
      c.beginPath();
      c.moveTo(-s*0.02, s*0.06);
      c.lineTo(s*0.10, s*0.06);
      c.lineTo(s*0.02, -s*0.10);
      c.lineTo(s*0.15, -s*0.10);
      c.lineTo(-s*0.02, -s*0.32);
      c.lineTo(s*0.04, -s*0.11);
      c.lineTo(-s*0.08, -s*0.11);
      c.closePath();
      c.fillStyle = '#FFD93F'; c.fill();
      c.strokeStyle = '#C89200'; c.lineWidth = s*0.02; c.stroke();
      c.restore();
    }
  }
}

function drawTail(c, s, pal, kind, t){
  const sway = Math.sin(t*2.2)*0.22;
  c.save();
  c.strokeStyle = pal.dark; c.lineWidth = Math.max(1.6, s*0.022);
  if (kind === 'flame'){
    c.translate(-s*0.42, s*0.20); c.rotate(-0.5 + sway*0.3);
    drawFlame(c, 0, 0, s*0.24, t*1.3);
  } else if (kind === 'fin'){
    c.fillStyle = pal.accent;
    c.beginPath();
    c.moveTo(-s*0.38, -s*0.06);
    c.quadraticCurveTo(-s*0.80, -s*0.30 + sway*s*0.15, -s*0.66, s*0.16);
    c.quadraticCurveTo(-s*0.55, s*0.04, -s*0.38, s*0.06);
    c.closePath(); c.fill(); c.stroke();
  } else if (kind === 'leaf'){
    c.save(); c.translate(-s*0.40, s*0.16); c.rotate(Math.PI + sway*0.4);
    drawLeafShape(c, 0, 0, s*0.34, 0, '#5FCC7A', '#2F7A44');
    c.restore();
  } else if (kind === 'bolt'){
    c.save(); c.translate(-s*0.42, s*0.14); c.rotate(sway*0.4);
    c.beginPath();
    c.moveTo(0,0); c.lineTo(-s*0.20,-s*0.10); c.lineTo(-s*0.14,s*0.06);
    c.lineTo(-s*0.34,-s*0.04); c.lineTo(-s*0.26,s*0.16);
    c.strokeStyle = '#FFC93F'; c.lineWidth = s*0.045; c.lineCap='round';
    c.stroke();
    c.restore();
  } else if (kind === 'cat'){
    c.save(); c.translate(-s*0.40, s*0.18); c.rotate(-0.9 + sway*0.5);
    c.beginPath();
    c.moveTo(0,0);
    c.quadraticCurveTo(-s*0.30, -s*0.05, -s*0.34, s*0.20);
    c.strokeStyle = pal.body; c.lineWidth = s*0.075; c.lineCap='round';
    c.stroke();
    c.restore();
  } else if (kind === 'rock'){
    c.fillStyle = pal.accent;
    c.beginPath(); c.arc(-s*0.46, s*0.16, s*0.14, 0, Math.PI*2); c.fill(); c.stroke();
  } else if (kind === 'puff'){
    c.fillStyle = '#FFFFFF';
    c.beginPath(); c.arc(-s*0.44, s*0.18, s*0.13, 0, Math.PI*2); c.fill(); c.stroke();
  } else if (kind === 'wisp'){
    const a = 0.35 + Math.sin(t*3)*0.12;
    c.fillStyle = `rgba(255,214,245,${a})`;
    c.beginPath(); c.arc(-s*0.46, s*0.12 + Math.sin(t*2.3)*s*0.06, s*0.16, 0, Math.PI*2); c.fill();
    c.fillStyle = `rgba(255,255,255,${a*0.8})`;
    c.beginPath(); c.arc(-s*0.46, s*0.12 + Math.sin(t*2.3)*s*0.06, s*0.08, 0, Math.PI*2); c.fill();
  }
  c.restore();
}

function drawBackFeature(c, s, pal, feature, t){
  if (feature === 'spikes'){
    c.fillStyle = pal.accent; c.strokeStyle = pal.dark;
    c.lineWidth = Math.max(1.4, s*0.02); c.lineJoin='round';
    const pts = [[-0.24,-0.50],[-0.06,-0.60],[0.14,-0.56],[0.30,-0.44]];
    for (const [dx,dy] of pts){
      c.beginPath();
      c.moveTo(dx*s - s*0.09, dy*s + s*0.06);
      c.lineTo(dx*s, dy*s - s*0.12);
      c.lineTo(dx*s + s*0.09, dy*s + s*0.06);
      c.closePath(); c.fill(); c.stroke();
    }
  } else if (feature === 'fin'){
    c.fillStyle = pal.accent; c.strokeStyle = pal.dark;
    c.lineWidth = Math.max(1.4, s*0.02);
    c.beginPath();
    c.moveTo(-s*0.16, -s*0.48);
    c.quadraticCurveTo(0, -s*0.86, s*0.18, -s*0.46);
    c.closePath(); c.fill(); c.stroke();
  }
}

function drawCreature(c, mon, x, y, size, facing, t, st){
  const s = size, pal = mon.sp.pal;
  c.save();
  c.translate(x + (st.ox||0), y + (st.oy||0));
  if (st.rot) c.rotate(st.rot);
  const sc = (st.scale === undefined ? 1 : st.scale);
  c.scale(facing * sc, sc);
  if (st.alpha !== undefined && st.alpha < 1) c.globalAlpha = st.alpha;

  const bob = Math.sin(t*2.1 + mon.seed) * s*0.022;
  c.translate(0, bob);

  c.lineJoin = 'round'; c.lineCap = 'round';

  // tail (behind)
  drawTail(c, s, pal, mon.sp.tail, t);

  // back feature
  drawBackFeature(c, s, pal, mon.sp.feature, t);

  // ears (behind head)
  drawEars(c, s, pal, mon.sp.ears, t);

  // arms
  c.strokeStyle = pal.dark; c.lineWidth = Math.max(1.6, s*0.022);
  c.fillStyle = pal.body;
  for (const sg of [-1,1]){
    c.beginPath();
    c.ellipse(sg*s*0.44, s*0.05, s*0.105, s*0.15, sg*0.35, 0, Math.PI*2);
    c.fill(); c.stroke();
  }

  // feet
  c.fillStyle = pal.dark;
  for (const sg of [-1,1]){
    c.beginPath();
    c.ellipse(sg*s*0.20, s*0.50, s*0.135, s*0.075, 0, 0, Math.PI*2);
    c.fill();
  }

  // body
  const g = c.createRadialGradient(-s*0.16, -s*0.26, s*0.05, 0, 0, s*0.72);
  g.addColorStop(0, pal.light);
  g.addColorStop(0.5, pal.body);
  g.addColorStop(1, pal.dark);
  c.fillStyle = g;
  c.beginPath(); c.ellipse(0, 0, s*0.485, s*0.545, 0, 0, Math.PI*2); c.fill();
  c.strokeStyle = pal.dark; c.lineWidth = Math.max(1.8, s*0.024); c.stroke();

  // belly
  c.fillStyle = pal.belly;
  c.beginPath(); c.ellipse(0, s*0.26, s*0.28, s*0.21, 0, 0, Math.PI*2); c.fill();

  // eyes
  const eyeY = -s*0.17, eyeX = s*0.19;
  c.fillStyle = '#ffffff';
  for (const sg of [-1,1]){
    c.beginPath(); c.ellipse(sg*eyeX, eyeY, s*0.105, s*0.128, 0, 0, Math.PI*2); c.fill();
  }
  c.fillStyle = pal.eye;
  for (const sg of [-1,1]){
    c.beginPath(); c.ellipse(sg*eyeX + s*0.012, eyeY + s*0.018, s*0.062, s*0.082, 0, 0, Math.PI*2); c.fill();
  }
  c.fillStyle = 'rgba(255,255,255,.92)';
  for (const sg of [-1,1]){
    c.beginPath(); c.ellipse(sg*eyeX - s*0.026, eyeY - s*0.038, s*0.028, s*0.032, 0, 0, Math.PI*2); c.fill();
  }
  c.fillStyle = 'rgba(255,255,255,.55)';
  for (const sg of [-1,1]){
    c.beginPath(); c.ellipse(sg*eyeX + s*0.035, eyeY + s*0.045, s*0.015, s*0.017, 0, 0, Math.PI*2); c.fill();
  }

  // blush
  c.fillStyle = 'rgba(255,120,140,.28)';
  for (const sg of [-1,1]){
    c.beginPath(); c.ellipse(sg*s*0.335, s*0.03, s*0.078, s*0.045, 0, 0, Math.PI*2); c.fill();
  }

  // mouth
  c.strokeStyle = pal.eye; c.lineWidth = Math.max(1.5, s*0.017); c.lineCap='round';
  c.beginPath(); c.arc(0, s*0.0, s*0.058, 0.18*Math.PI, 0.82*Math.PI); c.stroke();

  // head feature
  if (mon.sp.feature === 'flame') drawFlame(c, 0, -s*0.58, s*0.30, t*1.1);
  else if (mon.sp.feature === 'leaf') drawSprout(c, s, t);
  else if (mon.sp.feature === 'bolt') drawBolt(c, s, t);
  else if (mon.sp.feature === 'crystal') drawCrystal(c, s, t);
  else if (mon.sp.feature === 'halo') drawHalo(c, s, t);

  c.restore();
}

   BACKGROUND
   ============================================================ */
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

function drawBackground(t){
  // sky
  const sky = ctx.createLinearGradient(0,0,0,420);
  sky.addColorStop(0,   '#3f8fd4');
  sky.addColorStop(0.32,'#82c6ee');
  sky.addColorStop(0.62,'#bfe6f7');
  sky.addColorStop(0.85,'#ffe9bb');
  sky.addColorStop(1,   '#ffd08a');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,440);

  // sun glow
  const sun = ctx.createRadialGradient(770, 95, 8, 770, 95, 240);
  sun.addColorStop(0,   'rgba(255,250,220,.95)');
  sun.addColorStop(0.18,'rgba(255,236,170,.55)');
  sun.addColorStop(0.55,'rgba(255,214,140,.16)');
  sun.addColorStop(1,   'rgba(255,200,120,0)');
  ctx.fillStyle = sun;
  ctx.fillRect(480,-80,480,420);

  ctx.fillStyle = 'rgba(150,190,215,.55)';

  // hills
  ctx.fillStyle = '#79bd6c';
  ctx.beginPath();

  ctx.quadraticCurveTo(900, 352, 1010, 402);
  ctx.lineTo(1010, 470); ctx.lineTo(-50, 470);

  ctx.fillStyle = '#63b058';

function drawCloud(x,y,sc,alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x,y); ctx.scale(sc,sc);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(0,0,32,0,Math.PI*2);
  ctx.arc(38,8,26,0,Math.PI*2);
  ctx.arc(-36,10,24,0,Math.PI*2);
  ctx.arc(12,-16,24,0,Math.PI*2);
  ctx.arc(-14,18,20,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawPlatform(cx, cy, rx, ry, t, glow){
  // outer glow ring
  ctx.save();
  const rg = ctx.createRadialGradient(cx, cy, rx*0.2, cx, cy, rx*1.15);
  rg.addColorStop(0,'rgba(255,255,255,0)');
  rg.addColorStop(0.8,'rgba(255,255,255,.05)');
  rg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.ellipse(cx, cy, rx*1.15, ry*1.5, 0,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // main ellipse
  const g = ctx.createLinearGradient(cx, cy-ry, cx, cy+ry);
  g.addColorStop(0,'#a3e07d');
  g.addColorStop(0.55,'#7fce5f');
  g.addColorStop(1,'#4f9c3e');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0,0,Math.PI*2); ctx.fill();

  // top highlight
  const hg = ctx.createLinearGradient(cx, cy-ry*0.9, cx, cy+ry*0.2);
  hg.addColorStop(0,'rgba(255,255,255,.4)');
  hg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.ellipse(cx, cy-ry*0.25, rx*0.88, ry*0.62, 0,0,Math.PI*2); ctx.fill();

  // rim
  ctx.strokeStyle = 'rgba(255,255,255,.22)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0,0,Math.PI*2); ctx.stroke();

  // dark under-rim
  ctx.strokeStyle = 'rgba(30,70,25,.28)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(cx, cy+ry*0.85, rx*0.94, ry*0.5, 0, 0, Math.PI); ctx.stroke();
}

/* ============================================================
   PARTICLES
   ============================================================ */
function spawnParticles(x, y, color, count, opts){
  opts = opts || {};
  for (let i=0;i<count;i++){
    const a = opts.angle !== undefined ? opts.angle + rand(-0.8,0.8) : rand(0, Math.PI*2);
    const sp = rand(opts.speedMin||60, opts.speedMax||260);
    G.particles.push({
      x, y,
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp - (opts.lift||40),
      life: rand(0.45, opts.life||0.95),
      maxLife: 1,
      size: rand(opts.sizeMin||2.5, opts.sizeMax||7),
      color,
      gravity: opts.gravity === undefined ? 420 : opts.gravity,
      shape: opts.shape || 'circle',
      rot: rand(0,6.28),
      vr: rand(-8,8),
    });
  }
}

function updateParticles(dt){
  for (let i=G.particles.length-1;i>=0;i--){
    const p = G.particles[i];
    p.life -= dt;
    if (p.life <= 0){ G.particles.splice(i,1); continue; }
    p.vy += p.gravity * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= (1 - 1.6*dt);
    p.rot += p.vr*dt;
  }
}

function drawParticles(){
  for (const p of G.particles){
    const a = clamp(p.life / 0.6, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    if (p.shape === 'star'){
      ctx.beginPath();
      for (let k=0;k<5;k++){
        const ang = k * Math.PI*2/5 - Math.PI/2;
        const ang2 = ang + Math.PI/5;
        ctx.lineTo(Math.cos(ang)*p.size, Math.sin(ang)*p.size);
        ctx.lineTo(Math.cos(ang2)*p.size*0.45, Math.sin(ang2)*p.size*0.45);
      }
      ctx.closePath(); ctx.fill();
    } else if (p.shape === 'spark'){
      ctx.fillRect(-p.size*0.5, -p.size*0.16, p.size, p.size*0.32);
    } else {
      ctx.beginPath(); ctx.arc(0,0,p.size,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

/* ============================================================
   BALL RENDER
   ============================================================ */
function drawBallShape(c, x, y, r, rot, kind){
  const b = BALLS[kind] || BALLS.poke;
  c.save();
  c.translate(x,y); c.rotate(rot);

  // shadow
  c.save();
  c.globalAlpha = 0.3;
  c.beginPath(); c.arc(0, r*0.12, r, 0, Math.PI*2);
  c.fillStyle = '#000'; c.fill();
  c.restore();

  // bottom white
  c.beginPath(); c.arc(0,0,r,0,Math.PI); c.closePath();
  const wg = c.createLinearGradient(0,0,0,r);
  wg.addColorStop(0,'#ffffff'); wg.addColorStop(1,'#c9cfdd');
  c.fillStyle = wg; c.fill();

  // top colored
  c.beginPath(); c.arc(0,0,r,Math.PI,0); c.closePath();
  const tg = c.createLinearGradient(0,-r,0,0);
  tg.addColorStop(0, shade(b.top, 1.35)); tg.addColorStop(1, b.top);
  c.fillStyle = tg; c.fill();

  // band
  c.fillStyle = '#161a26';
  c.fillRect(-r, -r*0.15, r*2, r*0.30);

  // center button
  c.beginPath(); c.arc(0,0,r*0.35,0,Math.PI*2);
  c.fillStyle = '#161a26'; c.fill();
  c.beginPath(); c.arc(0,0,r*0.23,0,Math.PI*2);
  c.fillStyle = '#f2f5ff'; c.fill();
  c.beginPath(); c.arc(0,-r*0.04,r*0.10,0,Math.PI*2);
  c.fillStyle = 'rgba(255,255,255,.9)'; c.fill();

  // outline
  c.beginPath(); c.arc(0,0,r,0,Math.PI*2);
  c.strokeStyle = '#161a26'; c.lineWidth = Math.max(1.6, r*0.13); c.stroke();

  // highlight
  c.save();
  c.globalAlpha = 0.75;
  c.beginPath(); c.ellipse(-r*0.34,-r*0.42, r*0.24, r*0.13, -0.55, 0, Math.PI*2);
  c.fillStyle = '#fff'; c.fill();
  c.restore();

  c.restore();
}

function shade(hex, f){
  const n = parseInt(hex.slice(1),16);
  let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  r = clamp(Math.round(r*f),0,255);
  g = clamp(Math.round(g*f),0,255);
  b = clamp(Math.round(b*f),0,255);
  return '#' + ((1<<24) + (r<<16) + (g<<8) + b).toString(16).slice(1);
}

   POSITIONS

const POS = {
  enemy:  { x: 700, y: 252, size: 122, platform: { x: 700, y: 322, rx: 132, ry: 33 } },
  player: { x: 268, y: 372, size: 152, platform: { x: 268, y: 452, rx: 168, ry: 40 } },

/* ============================================================
   RENDER LOOP
   ============================================================ */
let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - lastT)/1000);
  lastT = now;
  G.time = now/1000;
  const t = G.time;

  updateParticles(dt);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt*90);
  if (G.flashScreen > 0) G.flashScreen = Math.max(0, G.flashScreen - dt*3.4);
  if (G.pF && G.pF.flash > 0) G.pF.flash = Math.max(0, G.pF.flash - dt*4.5);
  if (G.eF && G.eF.flash > 0) G.eF.flash = Math.max(0, G.eF.flash - dt*4.5);

  ctx.save();
  ctx.clearRect(0,0,W,H);

  if (G.shake > 0){
    ctx.translate((Math.random()-0.5)*G.shake, (Math.random()-0.5)*G.shake);
  }

  drawBackground(t);

  // platforms
  drawPlatform(POS.enemy.platform.x, POS.enemy.platform.y, POS.enemy.platform.rx, POS.enemy.platform.ry, t);
  drawPlatform(POS.player.platform.x, POS.player.platform.y, POS.player.platform.rx, POS.player.platform.ry, t);

  // shadows
  drawShadow(POS.enemy.platform.x, POS.enemy.platform.y + 2, POS.enemy.size*0.62, POS.enemy.size*0.16, 0.32);
  drawShadow(POS.player.platform.x, POS.player.platform.y + 2, POS.player.size*0.62, POS.player.size*0.16, 0.32);

  // enemy creature
  if (G.wild && G.eF && G.eF.visible !== false){
    if (G.eF.flash > 0.02) ctx.filter = `brightness(${1 + G.eF.flash*2.6}) saturate(${1 - G.eF.flash*0.6})`;
    drawCreature(ctx, G.wild, POS.enemy.x, POS.enemy.y, POS.enemy.size, -1, t, G.eF);
    ctx.filter = 'none';
  }

  // player creature
  if (G.pF && G.team[G.active] && G.pF.visible !== false){
    if (G.pF.flash > 0.02) ctx.filter = `brightness(${1 + G.pF.flash*2.6}) saturate(${1 - G.pF.flash*0.6})`;
    drawCreature(ctx, G.team[G.active], POS.player.x, POS.player.y, POS.player.size, 1, t, G.pF);
    ctx.filter = 'none';
  }

  drawParticles();

  // ball
  if (G.ball && G.ball.visible){
    drawBallShape(ctx, G.ball.x, G.ball.y, G.ball.r, G.ball.rot, G.ball.kind);
  }

  ctx.restore();

  // screen flash
  if (G.flashScreen > 0){
    ctx.save();
    ctx.globalAlpha = G.flashScreen * 0.6;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  // vignette
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.42, W/2, H/2, H*0.95);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,.45)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);

  requestAnimationFrame(loop);
}

function drawShadow(x, y, rx, ry, a){
  const g = ctx.createRadialGradient(x, y, 0, x, y, rx);
  g.addColorStop(0, `rgba(15,35,20,${a})`);
  g.addColorStop(0.6, `rgba(15,35,20,${a*0.5})`);
  g.addColorStop(1, 'rgba(15,35,20,0)');
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1, ry/rx);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0,0,rx,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

const msgEl   = $('msg');

function setMsg(text){
  msgEl.textContent = text;
  msgEl.classList.remove('pop');
  void msgEl.offsetWidth;
  msgEl.classList.add('pop');
}

function say(text, ms){
  setMsg(text);
  return wait(ms === undefined ? 1150 : ms);
}

function clearMenu(){
  menuEl.innerHTML = '';
  menuEl.className = '';
}

function makeBtn(label, sub, cls, onClick, disabled){
  const b = document.createElement('button');
  b.className = 'btn' + (cls ? ' ' + cls : '');
  if (sub){
    const s1 = document.createElement('span');
    s1.textContent = label;
    const s2 = document.createElement('small');
    s2.textContent = sub;
    b.appendChild(s1); b.appendChild(s2);
  } else {
    b.textContent = label;
  }
  if (disabled) b.disabled = true;
  b.addEventListener('click', () => { sfx.click(); onClick(); });
  return b;
}

function hpColor(pct){
  if (pct > 50) return 'linear-gradient(90deg,#5bf09a,#22b95c)';
  if (pct > 22) return 'linear-gradient(90deg,#ffe066,#f0b400)';
  return 'linear-gradient(90deg,#ff7b7b,#e02020)';
}

/* ============================================================
   BATTLE ANIMATIONS
   ============================================================ */
async function attackLunge(side){
  const f = side === 'player' ? G.pF : G.eF;
  const dir = side === 'player' ? 1 : -1;
  await tween(f, { ox: 74*dir, oy: -26 }, 145, p => p*p);
  await tween(f, { ox: 0, oy: 0 }, 230, p => 1-Math.pow(1-p,2));
}

async function hitReact(side){
  const f = side === 'player' ? G.pF : G.eF;
  const dir = side === 'player' ? 1 : -1;
  f.flash = 1;
  sfx.hit();
  G.shake = 12;
  const baseX = POS[side === 'player' ? 'player' : 'enemy'].x;
  const baseY = POS[side === 'player' ? 'player' : 'enemy'].y;
  for (let i=0;i<3;i++){
    f.ox = -8*dir; await wait(45);
    f.ox =  8*dir; await wait(45);
  }
  f.ox = 0;
  await wait(60);
}

async function faintAnim(side){
  const f = side === 'player' ? G.pF : G.eF;
  sfx.faint();
  const dir = side === 'player' ? 1 : -1;
  await tween(f, { oy: 72, rot: 1.35*dir, alpha: 0, scale: 0.72 }, 780, p => 1-Math.pow(1-p,3));
}

function moveVfx(type, side, power){
  const pos = side === 'enemy' ? POS.enemy : POS.player;
  const target = side === 'enemy' ? POS.player : POS.enemy;
  const tx = target.x + rand(-30,30);
  const ty = target.y + rand(-30,30);
  const ty2 = TYPES[type];

  const cols = {
    fire:     ['#ff7a2e','#ffd166','#ff4d15'],
    water:    ['#5fc6ff','#a8e4ff','#2a86e8'],
    grass:    ['#63d97e','#c8f7a8','#2f9c4e'],
    electric: ['#ffe066','#fff8c4','#ffb700'],
    rock:     ['#c9a06a','#e6d2ae','#8a6a3c'],
    ice:      ['#a6f0f5','#e6feff','#5fd0e0'],

    normal:   ['#dfe5f2','#ffffff','#98a0b5'],
  }[type] || ['#ffffff'];

  });

/* ============================================================
   DAMAGE / CATCH MATH
   ============================================================ */
function calcDamage(atkMon, defMon, move){
  const eff = typeEff(move.type, defMon.sp.type);
  if (eff === 0) return { dmg:0, eff, crit:false };
  const base = ((2*atkMon.level/5 + 2) * move.power * (atkMon.atk / defMon.def)) / 50 + 2;
  const stab = move.type === atkMon.sp.type ? 1.5 : 1;
  const crit = Math.random() < 0.0625;
  const critM = crit ? 1.5 : 1;
  const rnd = rand(0.85, 1.0);
  let dmg = Math.floor(base * stab * eff * critM * rnd);
  dmg = Math.max(1, dmg);
  return { dmg, eff, crit };
}

function catchChance(mon, ballKind){
  const hpFrac = mon.hp / mon.maxHp;
  const c = mon.sp.catchRate * BALLS[ballKind].bonus * (1 - hpFrac*0.76);
  return clamp(c, 0.04, 0.95);
}

/* ============================================================
   BATTLE ACTIONS
   ============================================================ */
function activeMon(){ return G.team[G.active]; }

async function doAction(action){
  if (G.busy || G.phase !== 'battle') return;
  G.busy = true;
  clearMenu();
  msgEl.textContent = '...';

  const p = activeMon();
  const e = G.wild;

  // speed determines order
  const pSpd = p.spd * rand(0.88, 1.12);
  const eSpd = e.spd * rand(0.88, 1.12);
  const playerFirst = action.kind === 'switch' ? true : pSpd >= eSpd;

  const playerAction = async () => {
    if (action.kind === 'move'){
      await useMove(p, e, action.move, 'player');
    } else if (action.kind === 'ball'){
      await throwBall(action.ball);
    } else if (action.kind === 'switch'){
      await doSwitch(action.index, true);
    } else if (action.kind === 'run'){
      await tryRun();
    }
  };

  const enemyAction = async () => {
    if (G.phase !== 'battle') return;
    if (!G.wild || G.wild.hp <= 0) return;
    if (!activeMon() || activeMon().hp <= 0) return;
    await enemyTurn();
  };

  if (playerFirst){
    await playerAction();
    if (await checkEnd()) return;
    await enemyAction();
    if (await checkEnd()) return;
  } else {
    await enemyAction();
    if (await checkEnd()) return;
    await playerAction();
    if (await checkEnd()) return;
  }

  G.busy = false;
  showMainMenu();
}

async function checkEnd(){
  if (G.phase !== 'battle') return true;

  if (G.wild && G.wild.hp <= 0){
    await onWildFaint();
    return true;
  }
  if (activeMon() && activeMon().hp <= 0){
    await onPlayerFaint();
    return true;
  }
  return false;
}

async function useMove(user, target, moveKey, side){
  const mv = MOVES[moveKey];
  const userName = user.sp.name;
  const label = side === 'player' ? 'Bạn' : 'Đối thủ';
  await say(`${userName} dùng ${mv.name}!`, 850);

  if (Math.random() > mv.acc){
    await say('... nhưng đã trượt!', 1000);
    await wait(150);
    return;
  }

  await attackLunge(side);

  const foeSide = side === 'player' ? 'enemy' : 'player';
  const res = calcDamage(user, target, mv);

  moveVfx(mv.type, side, mv.power);

  target.hp = Math.max(0, target.hp - res.dmg);
  await hitReact(foeSide);
  refreshBars();

  if (res.crit) sfx.crit();

  // effectiveness text
  let txt = '';
  if (res.eff > 1.5) txt = ' Rất hiệu quả!';
  else if (res.eff > 0 && res.eff < 1) txt = ' Không mấy hiệu quả...';
  else if (res.eff === 0) txt = ' Không có tác dụng...';
  if (res.crit) txt = ' Đòn chí mạng!' + txt;

  // drain
  if (mv.drain && res.dmg > 0){
    const heal = Math.max(1, Math.floor(res.dmg * mv.drain));
    user.hp = Math.min(user.maxHp, user.hp + heal);
    refreshBars();
    spawnParticles(POS[side === 'player' ? 'player' : 'enemy'].x, POS[side === 'player' ? 'player' : 'enemy'].y,
      '#7ee08f', 14, {speedMin:30, speedMax:110, lift:-60, gravity:-40, life:1});
    txt += ` Hồi ${heal} HP!`;
  }

  if (txt) await say(txt.trim(), 1100);
  else await wait(300);
}

async function enemyTurn(){
  if (!G.wild || G.wild.hp <= 0) return;
  const p = activeMon();
  if (!p || p.hp <= 0) return;

  const key = chooseEnemyMove();
  await wait(280);
  await useMove(G.wild, p, key, 'enemy');
  refreshBars();
}

function chooseEnemyMove(){
  const e = G.wild, p = activeMon();
  let best = e.moves[0], bestScore = -1;
  for (const k of e.moves){
    const m = MOVES[k];
    const eff = typeEff(m.type, p.sp.type);
    const stab = m.type === e.sp.type ? 1.4 : 1;
    const score = m.power * eff * stab * rand(0.75, 1.25);
    if (score > bestScore){ bestScore = score; best = k; }
  }
  return best;
}

async function doSwitch(index, announce){
  const old = activeMon();
  if (announce) await say(`Quay về đi, ${old.sp.name}!`, 900);

  G.active = index;
  const nm = activeMon();
  G.pF = { ox:0, oy:0, scale:0.1, rot:0, flash:0, alpha:0, visible:true };

  if (announce) await say(`Tiến lên, ${nm.sp.name}!`, 850);

  await tween(G.pF, { scale: 1, alpha: 1 }, 480, p => 1-Math.pow(1-p,3));
  spawnParticles(POS.player.x, POS.player.y, TYPES[nm.sp.type].c1, 18,
    {speedMin:50, speedMax:200, lift:60, life:0.9});
  refreshBars();
}

async function throwBall(kind){
  G.balls[kind]--;
  refreshBars();

  await say(`Bạn ném ${BALLS[kind].name}!`, 620);
  sfx.throw();

  const from = { x: 150, y: 470 };
  const to   = { x: POS.enemy.x, y: POS.enemy.y };

  G.ball = { visible:true, x: from.x, y: from.y, r: 15, rot: 0, kind };
  G.ball.scale = 1;

  // arc flight
  await new Promise(res => {
    const t0 = performance.now(), dur = 620;
    const ball = G.ball;
    function step(now){
      const p = Math.min(1, (now-t0)/dur);
      ball.x = from.x + (to.x - from.x) * p;
      ball.y = from.y + (to.y - from.y) * p - Math.sin(Math.PI*p) * 250;
      ball.rot = p * Math.PI * 8;
      if (p < 1) requestAnimationFrame(step); else res();
    }
    requestAnimationFrame(step);
  });

  // impact
  G.flashScreen = 0.5;
  spawnParticles(to.x, to.y, '#ffffff', 18, {speedMin:60, speedMax:220, life:0.7});
  await wait(120);

  // absorb
  const chance = catchChance(G.wild, kind);
  await tween(G.eF, { scale: 0.05, alpha: 0, oy: 40 }, 420, p => p*p);
  G.eF.visible = false;
  await wait(180);

  // ball falls to platform
  const landY = POS.enemy.platform.y - 16;
  await new Promise(res => {
    const t0 = performance.now(), dur = 420;
    const b = G.ball, sy = b.y;
    function step(now){
      const p = Math.min(1, (now-t0)/dur);
      b.y = sy + (landY - sy) * (p*p);
      b.rot = p * 2;
      if (p < 1) requestAnimationFrame(step); else res();
    }
    requestAnimationFrame(step);
  });

  await wait(220);

  // shakes
  const perShake = Math.pow(chance, 1/4);
  let caught = true;
  const maxShakes = 4;
  for (let i=0;i<maxShakes;i++){
    sfx.shake();
    await tween(G.ball, { rot: -0.42 }, 130);
    await tween(G.ball, { rot:  0.42 }, 150);
    await tween(G.ball, { rot:  0.0  }, 120);
    await wait(140);
    if (Math.random() > perShake){
      caught = false;
      break;
    }
  }

  if (caught){
    sfx.catch();
    G.ball.rot = 0;
    for (let i=0;i<12;i++){
      spawnParticles(G.ball.x, G.ball.y, pick(['#ffe066','#fff3b0','#ffb700','#ffffff']),
        3, {speedMin:80, speedMax:230, lift:90, life:1.1, shape:'star', sizeMin:4, sizeMax:9, gravity:260});
      await wait(85);
    }
    await say(`Tuyệt vời! Bạn đã thu phục được ${G.wild.sp.name}!`, 1600);

    // add to team
    if (G.team.length < 6){
      G.team.push(G.wild);
      await say(`${G.wild.sp.name} đã gia nhập đội của bạn!`, 1300);
    } else {
      await say('Đội đã đầy, linh thú được thả về tự nhiên.', 1300);
    }
    G.caught++;
    G.ball.visible = false;
    await endBattle();
    return;
  } else {
    // break out
    G.ball.visible = false;
    sfx.hit();
    G.flashScreen = 0.7;
    spawnParticles(G.ball.x, G.ball.y, '#ffffff', 24, {speedMin:120, speedMax:340, life:0.8});
    spawnParticles(G.ball.x, G.ball.y, BALLS[kind].top, 16, {speedMin:80, speedMax:260, life:0.9});
    G.shake = 14;
    await wait(120);

    G.eF.visible = true;
    G.eF.alpha = 0;
    G.eF.scale = 0.4;
    await tween(G.eF, { alpha: 1, scale: 1 }, 380, p => 1-Math.pow(1-p,3));

    await say(`Ôi không! ${G.wild.sp.name} đã thoát ra!`, 1250);
    refreshBars();
  }
}

async function tryRun(){
  const p = activeMon(), e = G.wild;
  const chance = clamp(0.42 + (p.spd - e.spd) * 0.012, 0.18, 0.9);
  if (Math.random() < chance){
    sfx.run();
    await say('Bạn đã chạy thoát an toàn!', 1200);
    await endBattle();
  } else {
    await say('Không thể chạy thoát!', 1100);
  }
}

async function onWildFaint(){
  await say(`${G.wild.sp.name} đã gục ngã!`, 900);
  await faintAnim('enemy');
  await wait(320);

  // xp
  const p = activeMon();
  const gain = Math.floor(G.wild.level * 9 + 12);
  p.xp += gain;
  await say(`${p.sp.name} nhận được ${gain} điểm kinh nghiệm!`, 1200);

  while (p.xp >= p.xpNext){
    p.xp -= p.xpNext;
    p.level++;
    p.xpNext = p.level * 18;
    const oldMax = p.maxHp;
    p.maxHp = Math.floor(p.sp.base.hp * p.level / 42) + p.level + 11;
    p.hp += (p.maxHp - oldMax);
    p.atk = Math.floor(p.sp.base.atk * p.level / 42) + 5;
    p.def = Math.floor(p.sp.base.def * p.level / 42) + 5;
    p.spd = Math.floor(p.sp.base.spd * p.level / 42) + 5;
    sfx.levelup();
    refreshBars();
    spawnParticles(POS.player.x, POS.player.y, '#ffe066', 30,
      {speedMin:80, speedMax:280, lift:120, life:1.3, shape:'star', sizeMin:3, sizeMax:8});
    await say(`${p.sp.name} đã lên cấp ${p.level}!`, 1500);
  }
  refreshBars();

  // heal a bit
  const heal = Math.floor(p.maxHp * 0.35);
  if (p.hp < p.maxHp){
    p.hp = Math.min(p.maxHp, p.hp + heal);
    refreshBars();
    await say(`${p.sp.name} hồi phục ${heal} HP sau trận chiến.`, 1200);
  }

  await endBattle();
}

async function onPlayerFaint(){
  const p = activeMon();
  await say(`${p.sp.name} đã gục ngã!`, 1000);
  await faintAnim('player');
  await wait(300);

  const alive = G.team.filter(m => m.hp > 0);
  if (alive.length === 0){
    await gameOver();
    return;
  }

  const next = G.team.findIndex(m => m.hp > 0);
  await say('Hãy tiếp tục chiến đấu!', 900);
  G.active = next;
  G.pF = { ox:0, oy:0, scale:0.1, rot:0, flash:0, alpha:0, visible:true };
  await say(`Tiến lên, ${activeMon().sp.name}!`, 900);
  await tween(G.pF, { scale: 1, alpha: 1 }, 480, p2 => 1-Math.pow(1-p2,3));
  spawnParticles(POS.player.x, POS.player.y, TYPES[activeMon().sp.type].c1, 20,
    {speedMin:50, speedMax:200, lift:60, life:0.9});
  refreshBars();

  G.busy = false;
  showMainMenu();
}

async function gameOver(){
  G.phase = 'over';
  clearMenu();
  await say('Toàn bộ linh thú của bạn đã gục ngã...', 1600);

  const ov = $('overlay');
  ov.innerHTML = `
    <h1 style="background:linear-gradient(180deg,#ffd0d0,#ff5b5b);-webkit-background-clip:text;background-clip:text;">THẤT BẠI</h1>
    <p>Bạn đã thu phục được <b style="color:#ffd86b">${G.caught}</b> linh thú trong hành trình này.
    Đừng nản lòng — hãy thử lại và xây dựng một đội hình mạnh hơn!</p>
    <button class="big" id="btnRestart">CHƠI LẠI</button>
  `;
  ov.classList.remove('gone');
  $('btnRestart').addEventListener('click', () => {
    ov.classList.add('gone');
    setTimeout(() => showStarterSelect(), 420);
  });
}

/* ============================================================
   ENCOUNTER / BATTLE START
   ============================================================ */
async function endBattle(){
  G.phase = 'idle';
  clearMenu();
  G.ball = null;
  await wait(600);

  // fade out/in
  const fade = $('fade');
  fade.style.opacity = '1';
  await wait(460);

  // reset fighters
  G.wild = null;
  G.eF = null;
  eInfo.classList.add('hidden');

  // spawn next
  const level = clamp(3 + Math.floor(G.caught * 0.6) + ri(-1,2), 3, 14);
  await startEncounter(level);

  fade.style.opacity = '0';
  await wait(420);
}

async function startEncounter(level){
  // choose random species
  const keys = Object.keys(SPECIES);
  const key = pick(keys);
  G.wild = makeMon(key, level);
  G.eF = { ox:0, oy:0, scale:0.15, rot:0, flash:0, alpha:0, visible:true };

  G.phase = 'battle';
  G.busy = true;

  refreshBars();
  $('eInfo').classList.add('hidden');
  await wait(200);
  $('eInfo').classList.remove('hidden');

  await say(`Một ${G.wild.sp.name} hoang dã xuất hiện!`, 1000);

  await tween(G.eF, { scale: 1, alpha: 1 }, 520, p => 1-Math.pow(1-p,3));
  spawnParticles(POS.enemy.x, POS.enemy.y, TYPES[G.wild.sp.type].c1, 22,
    {speedMin:60, speedMax:240, lift:80, life:1});

  // make sure player's active mon is visible
  const p = activeMon();
  if (p){
    G.pF = { ox:0, oy:0, scale:1, rot:0, flash:0, alpha:1, visible:true };
    pInfo.classList.remove('hidden');
  }

  await say(`${G.wild.sp.name}: ${G.wild.sp.lore}`, 1800);

  G.busy = false;
  showMainMenu();
}

/* ============================================================
   STARTER SELECTION / INIT
   ============================================================ */
function renderCreatureThumb(canvasEl, mon, size){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvasEl.width = size*dpr;
  canvasEl.height = size*dpr;
  const c = canvasEl.getContext('2d');
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,size,size);
  c.save();
  c.translate(size/2, size*0.56);
  drawCreature(c, mon, 0, 0, size*0.78, 1, 0.4, {ox:0,oy:0,scale:1,rot:0,flash:0,alpha:1});
  c.restore();
}

function showStarterSelect(){
  G.phase = 'title';
  G.team = [];
  G.active = 0;
  G.wild = null;
  G.eF = null;
  G.pF = null;
  G.particles = [];
  G.ball = null;
  G.caught = 0;
  G.balls = { poke: 8, great: 4, ultra: 2 };
  eInfo.classList.add('hidden');
  pInfo.classList.add('hidden');
  clearMenu();

  const ov = $('overlay');
  ov.classList.remove('gone');
  ov.innerHTML = `
    <h1>CHỌN BẠN ĐỒNG HÀNH</h1>
    <p>Mỗi linh thú có hệ và chiêu thức riêng. Hãy chọn người bạn đồng hành đầu tiên của bạn!</p>
    <div id="starters"></div>
  `;

  const cont = $('starters');
  const picks = ['hoami','songvi','laniu'];

  picks.forEach(key => {
    const sp = SPECIES[key];
    const ty = TYPES[sp.type];
    const card = document.createElement('div');
    card.className = 'card';
    const cv = document.createElement('canvas');
    card.appendChild(cv);
    const nm = document.createElement('div');
    nm.className = 'cn'; nm.textContent = sp.name;
    card.appendChild(nm);
    const tb = document.createElement('div');
    tb.className = 'ct'; tb.textContent = ty.name;
    tb.style.background = `linear-gradient(135deg,${ty.c1},${ty.c2})`;
    card.appendChild(tb);
    cont.appendChild(card);

    const mon = makeMon(key, 8);
    renderCreatureThumb(cv, mon, 74);

    card.addEventListener('click', () => {
      sfx.click();
      chooseStarter(key);
    });
  });
}

async function chooseStarter(key){
  const ov = $('overlay');
  ov.classList.add('gone');

  // starter at level 8
  const starter = makeMon(key, 8);
  G.team = [starter];
  G.active = 0;
  G.pF = { ox:0, oy:0, scale:1, rot:0, flash:0, alpha:1, visible:true };

  refreshBars();

  await wait(500);

  const fade = $('fade');
  fade.style.opacity = '1';
  await wait(460);

  const level = ri(3,5);
  await startEncounter(level);

  fade.style.opacity = '0';
}

/* ============================================================
   MUTE BUTTON
   ============================================================ */
$('btnMute').addEventListener('click', () => {
  muted = !muted;
  $('btnMute').textContent = muted ? '🔇' : '🔊';
});

/* ============================================================
   START BUTTON
   ============================================================ */
$('btnStart').addEventListener('click', () => {
  sfx.click();
  showStarterSelect();
});

/* ============================================================
   BOOT
   ============================================================ */
resize();
setMsg('Nhấn "BẮT ĐẦU HÀNH TRÌNH" để bắt đầu!');
requestAnimationFrame(loop);

})();
