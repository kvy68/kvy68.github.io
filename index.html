<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật Khánh Vy 💝</title>
    <style>
        :root {
            --pink: #FFB6C1;
            --pink-dark: #FF69B4;
            --pink-deep: #FF1493;
            --blue: #87CEEB;
            --blue-dark: #4A90D9;
            --blue-deep: #1E5AAB;
            --white: #FFF5F7;
            --gold: #FFD700;
            --rose: #FFE4E1;
            --lavender: #E6E6FA;
            --bg: #FFF0F5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Quicksand', 'Arial', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #FFF0F5 0%, #FFE4E1 20%, #E8F4FD 50%, #FFE4E1 80%, #FFF0F5 100%);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            overflow-x: hidden;
            cursor: default;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes gradientShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            25% {
                background-position: 100% 0%;
            }
            50% {
                background-position: 100% 100%;
            }
            75% {
                background-position: 0% 100%;
            }
        }

        /* ============ PARTICLES BACKGROUND ============ */
        #particles-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .floating-element {
            position: absolute;
            pointer-events: none;
            animation: floatAround linear infinite;
            opacity: 0.7;
        }
        @keyframes floatAround {
            0% {
                transform: translateY(105vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-10vh) rotate(720deg) scale(1.3);
                opacity: 0;
            }
        }
        .sparkle-dot {
            position: fixed;
            pointer-events: none;
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 8px 2px rgba(255, 215, 0, 0.6), 0 0 15px 4px rgba(255, 182, 193, 0.4);
            animation: sparkleFloat 2.5s ease-in-out infinite;
        }
        @keyframes sparkleFloat {
            0%,
            100% {
                transform: translateY(0) scale(0.5);
                opacity: 0.3;
            }
            50% {
                transform: translateY(-25px) scale(1.2);
                opacity: 1;
            }
        }

        /* ============ MAIN CONTAINER ============ */
        .main-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ============ SCENES ============ */
        .scene {
            display: none;
            width: 100%;
            animation: sceneIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .scene.active {
            display: block;
        }
        @keyframes sceneIn {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.92);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ============ CARD STYLE ============ */
        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 28px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.06), 0 0 60px rgba(255, 182, 193, 0.15), 0 0 0 1px rgba(255, 255, 255,
                    0.5) inset;
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }
        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 30px;
            background: linear-gradient(45deg, #FF69B4, #87CEEB, #FF69B4, #4A90D9, #FF69B4);
            background-size: 400% 400%;
            z-index: -1;
            animation: borderGlow 4s ease infinite;
            opacity: 0.5;
        }
        @keyframes borderGlow {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        /* ============ ENVELOPE (Scene 1) ============ */
        .envelope-wrapper {
            cursor: pointer;
            display: inline-block;
            position: relative;
            transition: transform 0.3s;
        }
        .envelope-wrapper:hover {
            transform: scale(1.05);
        }
        .envelope-wrapper:active {
            transform: scale(0.95);
        }
        .envelope-emoji {
            font-size: 100px;
            animation: envelopeBounce 1.8s ease-in-out infinite;
            filter: drop-shadow(0 15px 25px rgba(255, 105, 180, 0.3));
            display: block;
        }
        @keyframes envelopeBounce {
            0%,
            100% {
                transform: translateY(0);
            }
            25% {
                transform: translateY(-18px);
            }
            50% {
                transform: translateY(0);
            }
            75% {
                transform: translateY(-8px);
            }
        }
        .envelope-hint {
            margin-top: 15px;
            font-size: 1em;
            color: #FF69B4;
            font-weight: 600;
            animation: hintPulse 1.5s ease-in-out infinite;
            letter-spacing: 1px;
        }
        @keyframes hintPulse {
            0%,
            100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }
        .envelope-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 35px;
            animation: sealGlow 2s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes sealGlow {
            0%,
            100% {
                filter: drop-shadow(0 0 5px #FFD700);
            }
            50% {
                filter: drop-shadow(0 0 20px #FFD700) drop-shadow(0 0 30px #FF69B4);
            }
        }

        /* ============ TYPEWRITER (Scene 2) ============ */
        .typewriter-container {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 30px 25px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #FFB6C1;
            margin: 20px 0;
        }
        .typewriter-text {
            font-size: 1.3em;
            color: #555;
            line-height: 2;
            text-align: center;
            min-height: 80px;
            font-style: italic;
            transition: all 0.3s;
        }
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: #FF69B4;
            margin-left: 3px;
            vertical-align: text-bottom;
            animation: blink 0.7s infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }
        .highlight-pink {
            color: #FF1493;
            font-weight: 700;
            font-style: normal;
        }
        .highlight-blue {
            color: #4A90D9;
            font-weight: 700;
            font-style: normal;
        }

        /* ============ TIMELINE (Scene 3) ============ */
        .timeline {
            position: relative;
            padding: 20px 0;
            margin: 20px 0;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(to bottom, #FF69B4, #4A90D9);
            border-radius: 10px;
            z-index: 0;
        }
        .timeline-item {
            display: flex;
            align-items: center;
            margin: 30px 0;
            position: relative;
            z-index: 1;
            opacity: 0;
            transform: translateX(-30px);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .timeline-item.revealed {
            opacity: 1;
            transform: translateX(0);
        }
        .timeline-item:nth-child(even) {
            transform: translateX(30px);
            flex-direction: row-reverse;
        }
        .timeline-item:nth-child(even).revealed {
            transform: translateX(0);
        }
        .timeline-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            border: 4px solid #FF69B4;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.4);
        }
        .timeline-item:nth-child(even) .timeline-dot {
            border-color: #4A90D9;
            box-shadow: 0 0 15px rgba(74, 144, 217, 0.4);
        }
        .timeline-content {
            width: 42%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: 18px 20px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        .timeline-date {
            font-weight: 700;
            font-size: 1.1em;
            color: #FF1493;
            margin-bottom: 5px;
        }
        .timeline-item:nth-child(even) .timeline-date {
            color: #4A90D9;
        }
        .timeline-desc {
            color: #555;
            font-size: 0.95em;
        }

        /* ============ FINAL SCENE (Scene 4) ============ */
        .final-message {
            font-size: 1.2em;
            color: #555;
            line-height: 2;
            margin: 20px 0;
            animation: fadeIn 1.5s ease forwards;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .final-heart {
            font-size: 60px;
            animation: heartBeat 1s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes heartBeat {
            0%,
            100% {
                transform: scale(1);
            }
            25% {
                transform: scale(1.25);
            }
            50% {
                transform: scale(1);
            }
            75% {
                transform: scale(1.15);
            }
        }

        /* ============ BUTTONS ============ */
        .btn {
            padding: 14px 32px;
            border-radius: 50px;
            border: none;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 1px;
            font-family: inherit;
            margin: 8px;
            position: relative;
            overflow: hidden;
        }
        .btn-pink {
            background: linear-gradient(135deg, #FF69B4, #FF1493);
            color: white;
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.35);
        }
        .btn-pink:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 35px rgba(255, 105, 180, 0.5);
        }
        .btn-blue {
            background: linear-gradient(135deg, #87CEEB, #4A90D9);
            color: white;
            box-shadow: 0 8px 25px rgba(74, 144, 217, 0.35);
        }
        .btn-blue:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 35px rgba(74, 144, 217, 0.5);
        }
        .btn-gold {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: white;
            box-shadow: 0 8px 25px rgba(255, 165, 0, 0.35);
        }
        .btn-gold:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 35px rgba(255, 165, 0, 0.5);
        }
        .btn:active {
            transform: scale(0.94);
        }

        /* ============ CONFETTI ============ */
        .confetti-piece {
            position: fixed;
            pointer-events: none;
            z-index: 2000;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0% {
                transform: translateY(-80px) rotate(0deg) scale(1);
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(720deg) scale(0.2);
                opacity: 0;
            }
        }

        /* Toast */
        .toast-msg {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 600;
            color: #FF1493;
            z-index: 3000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            animation: toastSlideIn 0.5s ease forwards, toastSlideOut 0.5s 2.5s ease forwards;
            white-space: nowrap;
            font-size: 0.95em;
        }
        @keyframes toastSlideIn {
            from {
                transform: translateX(-50%) translateY(-120px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }
        @keyframes toastSlideOut {
            from {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
            to {
                transform: translateX(-50%) translateY(-120px);
                opacity: 0;
            }
        }

        .age-badge {
            display: inline-block;
            background: linear-gradient(135deg, #FF69B4, #4A90D9);
            color: white;
            font-size: 1.3em;
            font-weight: 700;
            padding: 8px 25px;
            border-radius: 50px;
            margin: 8px 0;
            letter-spacing: 2px;
            box-shadow: 0 5px 20px rgba(255, 105, 180, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 5px 20px rgba(255, 105, 180, 0.3);
            }
            50% {
                box-shadow: 0 5px 40px rgba(255, 105, 180, 0.6), 0 5px 40px rgba(74, 144, 217, 0.3);
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .card {
                padding: 30px 18px;
            }
            .envelope-emoji {
                font-size: 70px;
            }
            .typewriter-text {
                font-size: 1.1em;
            }
            .timeline-content {
                width: 50%;
                padding: 14px 12px;
            }
            .timeline-date {
                font-size: 0.9em;
            }
            .timeline-desc {
                font-size: 0.8em;
            }
            .btn {
                padding: 12px 22px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>

    <!-- Background particles -->
    <div id="particles-bg"></div>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <!-- Main container -->
    <div class="main-container">

        <!-- ==================== SCENE 1: ENVELOPE ==================== -->
        <div class="scene active" id="scene1">
            <div class="card">
                <div class="envelope-wrapper" id="envelopeBtn" title="Mở thư nào! 💌">
                    <span class="envelope-emoji">💌</span>
                    <span class="envelope-seal">💝</span>
                </div>
                <p class="envelope-hint">📬 Bấm vào phong bì để mở thư nhé~</p>
            </div>
        </div>

        <!-- ==================== SCENE 2: TYPEWRITER LETTER ==================== -->
        <div class="scene" id="scene2">
            <div class="card">
                <h2 style="color:#FF69B4; margin-bottom:5px;">💌 Thư gửi em</h2>
                <div class="typewriter-container">
                    <p class="typewriter-text" id="typewriterText"></p>
                </div>
                <button class="btn btn-pink" id="btnNextToTimeline" style="display:none;">
                    📅 Xem dòng thời gian →
                </button>
            </div>
        </div>

        <!-- ==================== SCENE 3: TIMELINE ==================== -->
        <div class="scene" id="scene3">
            <div class="card">
                <h2 style="color:#FF69B4; margin-bottom:5px;">📅 Dòng thời gian</h2>
                <div class="timeline" id="timelineContainer">
                    <div class="timeline-item" data-delay="0">
                        <div class="timeline-dot"></div>
                        <div class="timeline-content">
                            <div class="timeline-date">💙 10/01/2025</div>
                            <div class="timeline-desc">Ngày chúng ta quen nhau</div>
                        </div>
                    </div>
                    <div class="timeline-item" data-delay="400">
                        <div class="timeline-dot"></div>
                        <div class="timeline-content">
                            <div class="timeline-date">🎂 06/08</div>
                            <div class="timeline-desc">Và hôm nay là sinh nhật em</div>
                        </div>
                    </div>
                </div>
                <button class="btn btn-blue" id="btnNextToFinal" style="display:none;">
                    💖 Xem lời kết →
                </button>
            </div>
        </div>

        <!-- ==================== SCENE 4: FINAL MESSAGE ==================== -->
        <div class="scene" id="scene4">
            <div class="card">
                <div class="final-heart">❤️</div>
                <div class="age-badge" id="ageBadge">✨ Tuổi 17 ✨</div>
                <p class="final-message" id="finalMessageText">
                    Cảm ơn em đã dành vài phút để xem món quà nhỏ này.<br>
                    Chúc em có một tuổi mới thật hạnh phúc. ❤️
                </p>
                <p style="color:#999; font-size:0.85em; margin-top:10px; line-height:1.6;" id="dailyMessage"></p>
                <button class="btn btn-gold" onclick="location.reload();">
                    🔄 Xem lại từ đầu
                </button>
            </div>
        </div>

    </div>

    <script>
        // ============ CONFIGURATION ============
        const CONFIG = {
            birthDay: 6,
            birthMonth: 8, // August (0-indexed: 7 in JS Date)
            birthYear: 2009, // Khánh Vy sinh năm 2009 (17 tuổi vào 2026)
            meetDate: new Date(2025, 0, 10), // 10/01/2025
            recipientName: 'Khánh Vy',
            pronoun: 'em',
        };

        // ============ BACKGROUND PARTICLES ============
        function createBackgroundParticles() {
            const container = document.getElementById('particles-bg');
            const emojis = ['🌸', '💕', '🩷', '🩵', '✨', '💗', '🌷', '🦋', '💎', '🎀', '💖', '💝', '⭐', '🌟', '💫'];
            for (let i = 0; i < 30; i++) {
                const el = document.createElement('span');
                el.className = 'floating-element';
                el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.fontSize = (10 + Math.random() * 22) + 'px';
                el.style.animationDuration = (8 + Math.random() * 18) + 's';
                el.style.animationDelay = Math.random() * 14 + 's';
                container.appendChild(el);
            }
            for (let i = 0; i < 35; i++) {
                const dot = document.createElement('div');
                dot.className = 'sparkle-dot';
                dot.style.left = Math.random() * 100 + '%';
                dot.style.top = Math.random() * 100 + '%';
                dot.style.animationDelay = Math.random() * 3 + 's';
                dot.style.animationDuration = (1.8 + Math.random() * 3) + 's';
                container.appendChild(dot);
            }
        }
        createBackgroundParticles();

        // ============ UTILS ============
        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast-msg';
            t.textContent = msg;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => t.remove(), 3200);
        }

        function burstConfetti(x, y, count = 50) {
            const colors = ['#FF69B4', '#FF1493', '#FFB6C1', '#87CEEB', '#4A90D9', '#FFD700', '#FFA500', '#FFC0CB',
                '#00CED1', '#FFF'
            ];
            for (let i = 0; i < count; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                const size = 6 + Math.random() * 12;
                piece.style.width = size + 'px';
                piece.style.height = size * (Math.random() > 0.5 ? 1 : 1.6) + 'px';
                piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.left = x + 'px';
                piece.style.top = y + 'px';
                piece.style.animationDuration = (1.8 + Math.random() * 3) + 's';
                piece.style.animationDelay = Math.random() * 0.4 + 's';
                document.body.appendChild(piece);
                setTimeout(() => piece.remove(), 4000);
            }
        }

        // ============ AGE CALCULATION ============
        function getCurrentAge() {
            const today = new Date();
            const birthDate = new Date(CONFIG.birthYear, CONFIG.birthMonth - 1, CONFIG.birthDay);
            let age = today.getFullYear() - birthDate.getFullYear();

            // Check if birthday has passed this year
            const thisYearBirthday = new Date(today.getFullYear(), CONFIG.birthMonth - 1, CONFIG.birthDay);
            if (today < thisYearBirthday) {
                age--; // Haven't had birthday yet this year
            }
            return age;
        }

        function getNextBirthday() {
            const today = new Date();
            const thisYearBirthday = new Date(today.getFullYear(), CONFIG.birthMonth - 1, CONFIG.birthDay);

            if (today >= thisYearBirthday) {
                // Birthday has passed this year, next is next year
                return new Date(today.getFullYear() + 1, CONFIG.birthMonth - 1, CONFIG.birthDay);
            } else {
                // Birthday hasn't come yet this year
                return thisYearBirthday;
            }
        }

        function getLastBirthday() {
            const today = new Date();
            const thisYearBirthday = new Date(today.getFullYear(), CONFIG.birthMonth - 1, CONFIG.birthDay);

            if (today >= thisYearBirthday) {
                // This year's birthday has passed (or is today)
                return thisYearBirthday;
            } else {
                // This year's birthday hasn't come yet, last was last year
                return new Date(today.getFullYear() - 1, CONFIG.birthMonth - 1, CONFIG.birthDay);
            }
        }

        // ============ SCENE MANAGEMENT ============
        function showScene(sceneId) {
            document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
            const scene = document.getElementById(sceneId);
            scene.classList.add('active');
            scene.style.animation = 'none';
            scene.offsetHeight;
            scene.style.animation = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============ SCENE 1: ENVELOPE CLICK ============
        document.getElementById('envelopeBtn').addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            burstConfetti(cx, cy, 60);
            showToast('💌 Thư đang được mở...');

            setTimeout(() => {
                showScene('scene2');
                startTypewriter();
            }, 600);
        });

        // ============ SCENE 2: TYPEWRITER ============
        const letterLines = [
            'Gửi <span class="highlight-pink">' + CONFIG.recipientName + '</span> yêu quý,',
            'Hôm nay là một ngày thật đặc biệt...',
            'Ngày mà <span class="highlight-blue">một thiên thần</span> đã đến với thế giới này.',
            'Chúc <span class="highlight-pink">' + CONFIG.pronoun + '</span> tuổi mới thật rực rỡ,',
            'tràn đầy niềm vui và những điều <span class="highlight-blue">tuyệt vời nhất</span>.',
            'Mong mọi ước mơ của ' + CONFIG.pronoun + ' đều trở thành hiện thực ✨',
            '<span class="highlight-pink">Yêu ' + CONFIG.pronoun + ' thật nhiều!</span> 💝'
        ];

        function startTypewriter() {
            const textEl = document.getElementById('typewriterText');
            const btnNext = document.getElementById('btnNextToTimeline');
            textEl.innerHTML = '<span class="cursor"></span>';
            textEl.classList.remove('done');
            btnNext.style.display = 'none';

            let lineIndex = 0;
            let charIndex = 0;
            let currentHTML = '';

            function typeNext() {
                if (lineIndex >= letterLines.length) {
                    textEl.innerHTML = currentHTML + '<span class="cursor"></span>';
                    textEl.classList.add('done');
                    btnNext.style.display = 'inline-block';
                    btnNext.style.animation = 'fadeIn 0.5s ease forwards';
                    return;
                }
                const line = letterLines[lineIndex];
                if (charIndex < line.length) {
                    if (line[charIndex] === '<') {
                        const tagEnd = line.indexOf('>', charIndex);
                        if (tagEnd !== -1) {
                            currentHTML += line.substring(charIndex, tagEnd + 1);
                            charIndex = tagEnd + 1;
                            textEl.innerHTML = currentHTML + '<span class="cursor"></span>';
                            setTimeout(typeNext, 20);
                            return;
                        }
                    }
                    currentHTML += line[charIndex];
                    charIndex++;
                    textEl.innerHTML = currentHTML + '<span class="cursor"></span>';
                    setTimeout(typeNext, 35 + Math.random() * 30);
                } else {
                    currentHTML += '<br>';
                    lineIndex++;
                    charIndex = 0;
                    textEl.innerHTML = currentHTML + '<span class="cursor"></span>';
                    setTimeout(typeNext, 250);
                }
            }
            setTimeout(typeNext, 400);
        }

        document.getElementById('btnNextToTimeline').addEventListener('click', function() {
            showScene('scene3');
            revealTimelineItems();
        });

        // ============ SCENE 3: TIMELINE REVEAL ============
        function revealTimelineItems() {
            const items = document.querySelectorAll('#timelineContainer .timeline-item');
            const btnNext = document.getElementById('btnNextToFinal');
            btnNext.style.display = 'none';

            items.forEach((item) => {
                const delay = parseInt(item.getAttribute('data-delay')) || 0;
                setTimeout(() => {
                    item.classList.add('revealed');
                    const rect = item.getBoundingClientRect();
                    burstConfetti(rect.left + rect.width / 2, rect.top + rect.height / 2, 15);
                }, delay);
            });

            const totalDelay = items.length > 0 ?
                parseInt(items[items.length - 1].getAttribute('data-delay')) + 800 :
                1000;
            setTimeout(() => {
                btnNext.style.display = 'inline-block';
                btnNext.style.animation = 'fadeIn 0.5s ease forwards';
            }, totalDelay);
        }

        document.getElementById('btnNextToFinal').addEventListener('click', function() {
            showScene('scene4');
            updateScene4();
            const rect = document.getElementById('scene4').getBoundingClientRect();
            burstConfetti(rect.left + rect.width / 2, rect.top + 100, 100);
            const age = getCurrentAge();
            showToast('🎉 Chúc mừng sinh nhật ' + CONFIG.recipientName + '! Tuổi ' + age + ' thật tuyệt vời! 🎂');
        });

        // ============ SCENE 4: UPDATE AGE & DAILY MESSAGE ============
        function updateScene4() {
            const today = new Date();
            const age = getCurrentAge();

            // Update age badge
            document.getElementById('ageBadge').textContent = '✨ Tuổi ' + age + ' ✨';

            // Calculate days since last birthday
            const lastBirthday = getLastBirthday();

            // Calculate difference in days
            const diffTime = today.getTime() - lastBirthday.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

            const dailyEl = document.getElementById('dailyMessage');

            // Daily messages array (index 0 = on birthday, index 1 = 1 day after, etc.)
            const messages = [
                '🎂 Hôm nay là sinh nhật em! Chúc em có một ngày thật đặc biệt và tràn ngập yêu thương! 💝',
                '💝 Một ngày sau sinh nhật, mong em vẫn giữ nụ cười rạng rỡ ấy.',
                '🌸 Ngày thứ 2: Hy vọng em đã có một bữa tiệc sinh nhật thật vui!',
                '✨ Ngày thứ 3: Mỗi ngày bên em đều là một món quà.',
                '💖 Ngày thứ 4: Tuổi mới của em nhất định sẽ thật đáng nhớ.',
                '🦋 Ngày thứ 5: Em xứng đáng với tất cả những điều tốt đẹp nhất.',
                '🌷 Ngày thứ 6: Cảm ơn em đã xuất hiện trong cuộc đời này.',
                '💎 Ngày thứ 7: Một tuần sau sinh nhật - mong em luôn hạnh phúc.',
                '🎀 Ngày thứ 8: Nụ cười của em là điều đẹp nhất anh từng thấy.',
                '💗 Ngày thứ 9: Chúc em một ngày tràn ngập yêu thương.',
                '🌟 Ngày thứ 10: Em là ngôi sao sáng nhất trên bầu trời.',
                '💙 Ngày thứ 11: Màu xanh yêu thích của em - như bầu trời rộng lớn.',
                '💕 Ngày thứ 12: Mỗi khoảnh khắc bên em đều quý giá.',
                '🩷 Ngày thứ 13: Mong em luôn được yêu thương và che chở.',
                '✨ Ngày thứ 14: Hai tuần rồi - sinh nhật vui chứ?',
                '🌸 Ngày thứ 15: Em là đóa hoa đẹp nhất trong vườn.',
                '💝 Ngày thứ 16: Tuổi mới - độ tuổi của những ước mơ lớn.',
                '🦋 Ngày thứ 17: Hãy bay cao như những chú bướm nhé em.',
                '💎 Ngày thứ 18: Em quý giá hơn bất kỳ viên kim cương nào.',
                '🌷 Ngày thứ 19: Mỗi ngày trôi qua, anh càng thấy may mắn vì có em.',
                '💖 Ngày thứ 20: Yêu em - hôm nay và mãi mãi.',
                '🎀 Ngày thứ 21: Ba tuần sau sinh nhật, mong em vẫn vui như ngày đầu.',
                '💗 Ngày thứ 22: Em là lý do khiến thế giới này đẹp hơn.',
                '🌟 Ngày thứ 23: Chúc em một ngày thật bình yên và ấm áp.',
                '💙 Ngày thứ 24: Bầu trời xanh kia cũng không đẹp bằng mắt em.',
                '💕 Ngày thứ 25: 25 ngày - và em vẫn là điều tuyệt vời nhất.',
                '🩷 Ngày thứ 26: Cả thế giới có thể thay đổi, nhưng tình cảm này thì không.',
                '✨ Ngày thứ 27: Mong em luôn tỏa sáng theo cách riêng của mình.',
                '🌸 Ngày thứ 28: Gần một tháng rồi - sinh nhật vẫn còn dư âm chứ?',
                '💝 Ngày thứ 29: Em là món quà quý giá nhất cuộc đời.',
                '🦋 Ngày thứ 30: Tròn một tháng! Chúc em luôn hạnh phúc và thành công.',
                '🌷 Ngày thứ 31: Mỗi ngày mới là một trang sách đẹp trong cuộc đời em.',
                '💎 Ngày thứ 32: Em tỏa sáng theo cách riêng của mình.',
                '💖 Ngày thứ 33: Thời gian trôi qua, nhưng tình cảm này vẫn vẹn nguyên.',
                '🌟 Ngày thứ 34: Mong những điều tốt đẹp luôn đến với em.',
                '💙 Ngày thứ 35: Như bầu trời xanh kia, tình yêu này là vô tận.',
                '🎀 Ngày thứ 36: Em là món quà mà cuộc sống đã ban tặng.',
                '💗 Ngày thứ 37: Mỗi ngày trôi qua đều đáng nhớ vì có em.',
                '✨ Ngày thứ 38: Chúc em luôn giữ được nụ cười trên môi.',
                '🌸 Ngày thứ 39: Hạnh phúc của em là niềm vui của anh.',
                '💝 Ngày thứ 40: 40 ngày rồi - và em vẫn thật đặc biệt.',
            ];

            if (diffDays >= 0 && diffDays < messages.length) {
                dailyEl.textContent = messages[diffDays];
            } else if (diffDays >= messages.length) {
                // Loop through messages for days beyond the array
                const loopIndex = diffDays % messages.length;
                dailyEl.textContent = messages[loopIndex] + ' 💫';
            } else {
                // Before birthday - show countdown
                const nextBirthday = getNextBirthday();
                const daysUntil = Math.ceil((nextBirthday - today) / (1000 * 60 * 60 * 24));
                if (daysUntil > 0 && daysUntil <= 30) {
                    dailyEl.textContent = '🎂 Còn ' + daysUntil + ' ngày nữa là đến sinh nhật em! Hồi hộp chưa? 💝';
                } else if (daysUntil > 30) {
                    dailyEl.textContent = '💝 Món quà này luôn ở đây chờ em. Sinh nhật sắp đến rồi!';
                } else {
                    dailyEl.textContent = '🎂 Hôm nay là sinh nhật em! Chúc em có một ngày thật đặc biệt! 💝';
                }
            }
        }

        // ============ INIT ============
        console.log('💝 Chúc mừng sinh nhật ' + CONFIG.recipientName + '! 💝');
        console.log('🌸 Tuổi hiện tại: ' + getCurrentAge());
        console.log('📅 Sinh nhật: ' + CONFIG.birthDay + '/' + CONFIG.birthMonth + '/' + CONFIG.birthYear);
        console.log('💌 Mở phong bì để bắt đầu câu chuyện nhé!');
    </script>
