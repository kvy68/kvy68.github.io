<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>PokéLens AR — Bắt Pokémon bằng Camera</title>
<style>
/* ============ RESET & BASE ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;overflow:hidden;background:#05060d;color:#fff;
  font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
#app{position:fixed;inset:0;overflow:hidden;isolation:isolate}

/* ============ CAMERA / BACKGROUND ============ */
#cam{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  display:none;background:#070a14;transform:scale(1.03);
  filter:saturate(1.06) contrast(1.04);
}
body.has-cam #cam{display:block}
#fallbackBg{
  position:absolute;inset:0;transition:opacity .9s ease;
  background:
    radial-gradient(1200px 800px at 18% 8%, #1e2d5c 0%, transparent 62%),
    radial-gradient(900px 700px at 86% 88%, #3d1d4d 0%, transparent 60%),
    radial-gradient(700px 500px at 60% 30%, #123a4a 0%, transparent 65%),
    linear-gradient(160deg,#080b18 0%,#0d1224 55%,#070912 100%);
}
body.has-cam #fallbackBg{opacity:0}

.vignette{
  position:absolute;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0,0,0,.62) 100%);
}
.grain{
  position:absolute;inset:0;pointer-events:none;z-index:2;opacity:.14;mix-blend-mode:overlay;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,.09) 0 1px, transparent 1px 4px);
}
/* AR corner brackets */
.ar-frame{position:absolute;inset:14px;pointer-events:none;z-index:2;opacity:.5}
.ar-frame i{
  position:absolute;width:26px;height:26px;border:2px solid rgba(120,225,255,.75);
  border-radius:3px;
}
.ar-frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.ar-frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.ar-frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.ar-frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}

/* ============ STAGE ============ */
#stage{position:absolute;inset:0;z-index:3}
#fx{position:absolute;inset:0;z-index:5;pointer-events:none}

/* ============ CREATURE ============ */
.mon{
  position:absolute;left:0;top:0;width:100px;height:100px;
  will-change:transform;z-index:3;
}
.mon-anim{width:100%;height:100%;animation:spawnIn .6s cubic-bezier(.34,1.56,.64,1) both}
.mon-float{width:100%;height:100%;animation:floaty 2.8s ease-in-out infinite}
.mon svg{
  width:100%;height:100%;display:block;overflow:visible;
  filter:drop-shadow(0 12px 18px rgba(0,0,0,.5));
}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spawnIn{
  0%{transform:scale(.1) rotate(-30deg);opacity:0}
  55%{transform:scale(1.16) rotate(6deg);opacity:1}
  100%{transform:scale(1) rotate(0);opacity:1}
}
.mon.sucked .mon-anim{animation:suck .36s cubic-bezier(.5,-.4,.9,.6) forwards}
@keyframes suck{
  0%{transform:scale(1) rotate(0);opacity:1;filter:brightness(1)}
  40%{transform:scale(1.25) rotate(-12deg);opacity:1;filter:brightness(3)}
  100%{transform:scale(0) rotate(360deg);opacity:0;filter:brightness(4)}
}
.mon.fleeing .mon-anim{animation:flee .7s ease-in forwards}
@keyframes flee{
  0%{transform:scale(1) translateY(0);opacity:1}
  25%{transform:scale(1.1) translateY(0);opacity:1}
  100%{transform:scale(.85) translateY(-160px);opacity:0}
}
.mon.rare::before{
  content:'';position:absolute;left:50%;top:50%;width:170px;height:170px;
  transform:translate(-50%,-50%);border-radius:50%;z-index:-1;
  background:radial-gradient(circle, var(--aura) 0%, transparent 68%);
  opacity:.55;animation:auraPulse 2.2s ease-in-out infinite;
}
@keyframes auraPulse{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.9)}50%{opacity:.7;transform:translate(-50%,-50%) scale(1.08)}}

/* spawn ring */
.ring{
  position:absolute;left:50%;top:50%;width:20px;height:20px;border-radius:50%;
  border:3px solid rgba(160,240,255,.9);transform:translate(-50%,-50%);
  pointer-events:none;animation:ringOut .7s ease-out forwards;
}
@keyframes ringOut{
  0%{width:20px;height:20px;opacity:1;border-width:4px}
  100%{width:190px;height:190px;opacity:0;border-width:1px}
}

/* ============ POKÉBALL ============ */
.ball-wrap{
  position:absolute;left:0;top:0;width:44px;height:44px;
  will-change:transform;z-index:8;pointer-events:none;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,.55));
}
.ball-spin{width:100%;height:100%;will-change:transform}
.ball-spin.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  0%{transform:rotate(0)}
  20%{transform:rotate(-24deg)}
  50%{transform:rotate(22deg)}
  75%{transform:rotate(-12deg)}
  100%{transform:rotate(0)}
}
.ball-spin.pop{animation:ballPop .5s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes ballPop{0%{transform:scale(1)}45%{transform:scale(1.35)}100%{transform:scale(1)}}
.ball-spin.burst{animation:ballBurst .4s ease-out forwards}
@keyframes ballBurst{
  0%{transform:scale(1) rotate(0)}
  35%{transform:scale(1.4) rotate(-18deg)}
  100%{transform:scale(.75) rotate(24deg);opacity:0}
}
.ball-spin.glow{animation:ballGlow 1.1s ease-out}
@keyframes ballGlow{
  0%{filter:drop-shadow(0 0 0 rgba(255,220,80,0))}
  40%{filter:drop-shadow(0 0 26px rgba(255,220,80,1)) brightness(1.5)}
  100%{filter:drop-shadow(0 0 0 rgba(255,220,80,0))}
}

/* ============ HUD ============ */
.hud{
  position:absolute;top:0;left:0;right:0;z-index:20;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 0;
  display:flex;justify-content:space-between;align-items:flex-start;
  pointer-events:none;
}
.hud > *{pointer-events:auto}
.pill{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(10,14,26,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.16);border-radius:999px;
  padding:8px 14px 8px 10px;font-size:15px;font-weight:700;letter-spacing:.3px;
  box-shadow:0 6px 22px rgba(0,0,0,.35);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1);
}
.pill:active{transform:scale(.94)}
.pill .ic{width:22px;height:22px;display:block;flex:0 0 auto}
.hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.pill.dex{padding:8px 14px;font-size:13.5px;cursor:pointer}
.pill.dex .ic{width:17px;height:17px}

/* ============ TOAST ============ */
#toast{
  position:absolute;left:50%;top:22%;transform:translate(-50%,-14px);
  z-index:30;pointer-events:none;opacity:0;
  background:rgba(8,12,22,.82);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.16);border-radius:14px;
  padding:11px 20px;font-size:14.5px;font-weight:700;letter-spacing:.3px;
  white-space:nowrap;box-shadow:0 10px 34px rgba(0,0,0,.5);
  transition:opacity .25s, transform .35s cubic-bezier(.34,1.56,.64,1);
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ CATCH BANNER ============ */
#banner{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.7);
  z-index:35;pointer-events:none;opacity:0;text-align:center;
  transition:opacity .3s, transform .45s cubic-bezier(.34,1.56,.64,1);
}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner .b-art{width:110px;height:110px;margin:0 auto 6px;filter:drop-shadow(0 10px 26px rgba(0,0,0,.6))}
#banner .b-title{
  font-size:13px;font-weight:800;letter-spacing:3px;color:#8ef0c0;
  text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.8);
}
#banner .b-name{
  font-size:28px;font-weight:900;letter-spacing:.5px;margin-top:2px;
  background:linear-gradient(180deg,#fff,#ffd76a);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 4px 24px rgba(255,190,60,.45);
}
#banner .b-pts{
  margin-top:6px;display:inline-block;font-size:13px;font-weight:800;
  background:rgba(255,200,60,.16);border:1px solid rgba(255,200,60,.45);
  color:#ffd76a;border-radius:999px;padding:4px 14px;
}

/* ============ OVERLAYS ============ */
.overlay{
  position:absolute;inset:0;z-index:40;display:flex;
  flex-direction:column;align-items:center;justify-content:center;
  padding:28px;
  background:radial-gradient(circle at 50% 30%, rgba(20,30,60,.86), rgba(4,6,14,.96));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:opacity .35s, visibility .35s;
}
.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}

/* Start */
#start .logo{
  font-size:clamp(38px,11vw,62px);font-weight:900;letter-spacing:-2px;line-height:1;
  background:linear-gradient(180deg,#fff 0%,#8fd7ff 45%,#4a9fff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 30px rgba(70,160,255,.55));
}
#start .sub{
  margin-top:10px;font-size:13px;font-weight:700;letter-spacing:5px;
  color:#7f93b8;text-transform:uppercase;
}
#start .hero-ball{
  width:130px;height:130px;margin:26px 0 8px;
  animation:heroFloat 3.4s ease-in-out infinite;
  filter:drop-shadow(0 18px 40px rgba(0,0,0,.6));
}
@keyframes heroFloat{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-16px) rotate(6deg)}}
#start .desc{
  max-width:340px;text-align:center;font-size:14.5px;line-height:1.65;
  color:#a9b8d4;margin-top:14px;
}
#start .desc b{color:#fff}
.btn{
  margin-top:26px;border:0;cursor:pointer;
  padding:17px 52px;border-radius:999px;
  font-size:16px;font-weight:900;letter-spacing:2px;color:#0a0e1a;
  background:linear-gradient(180deg,#ffe27a,#ffb020);
  box-shadow:0 10px 30px rgba(255,175,40,.4), inset 0 -3px 0 rgba(0,0,0,.18);
  transition:transform .16s cubic-bezier(.34,1.56,.64,1), box-shadow .2s;
  font-family:inherit;
}
.btn:active{transform:scale(.94);box-shadow:0 4px 16px rgba(255,175,40,.35)}
.btn.ghost{
  background:rgba(255,255,255,.08);color:#cfdcf5;
  box-shadow:none;border:1px solid rgba(255,255,255,.2);
  padding:14px 36px;font-size:14px;letter-spacing:1px;margin-top:14px;
}
.tips{
  margin-top:22px;display:flex;flex-direction:column;gap:9px;
  font-size:13px;color:#8697b8;max-width:330px;
}
.tips div{display:flex;gap:10px;align-items:center}
.tips span.k{
  flex:0 0 auto;width:22px;height:22px;border-radius:7px;
  background:rgba(120,200,255,.14);border:1px solid rgba(120,200,255,.3);
  display:grid;place-items:center;font-size:12px;
}

/* Dex */
#dex{justify-content:flex-start;padding-top:0}
#dex .sheet{
  width:100%;max-width:520px;height:100%;
  display:flex;flex-direction:column;
  padding-top:calc(env(safe-area-inset-top,0px) + 20px);
}
#dex .head{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 4px 16px;
}
#dex h2{font-size:22px;font-weight:900;letter-spacing:-.4px}
#dex h2 small{display:block;font-size:11.5px;letter-spacing:2.6px;color:#7f93b8;
  font-weight:800;text-transform:uppercase;margin-top:3px}
.closeBtn{
  width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.07);color:#fff;font-size:19px;cursor:pointer;
  display:grid;place-items:center;font-family:inherit;
  transition:transform .15s, background .2s;
}
.closeBtn:active{transform:scale(.9);background:rgba(255,255,255,.15)}
#dexGrid{
  flex:1;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:12px;padding:4px 4px 40px;
  -webkit-overflow-scrolling:touch;
}
#dexGrid::-webkit-scrollbar{width:4px}
#dexGrid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:4px}
.dex-card{
  position:relative;border-radius:18px;padding:14px 12px 12px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.1);
  display:flex;flex-direction:column;align-items:center;
  transition:transform .2s, background .2s;
  overflow:hidden;
}
.dex-card:active{transform:scale(.97)}
.dex-card.known{background:rgba(120,200,255,.09);border-color:rgba(120,200,255,.28)}
.dex-card .art{width:76px;height:76px;margin-bottom:6px}
.dex-card .art svg{width:100%;height:100%;overflow:visible}
.dex-card.unknown .art svg{filter:brightness(0) invert(.22);opacity:.55}
.dex-card .nm{font-size:13.5px;font-weight:800;letter-spacing:.2px}
.dex-card.unknown .nm{color:#5d6a85}
.dex-card .tp{
  font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
  color:#8fb6e8;margin-top:3px;
}
.dex-card.unknown .tp{color:#4d5a75}
.dex-card .cnt{
  position:absolute;top:9px;right:10px;font-size:11.5px;font-weight:900;
  background:rgba(255,255,255,.1);border-radius:999px;padding:2px 8px;color:#cfe0f7;
}
.dex-card.known .cnt{background:rgba(120,200,255,.22);color:#bfe4ff}
.dex-stats{
  display:flex;gap:10px;padding:0 4px 16px;
}
.stat{
  flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  border-radius:14px;padding:10px 12px;
}
.stat .v{font-size:19px;font-weight:900;letter-spacing:-.5px}
.stat .l{font-size:10px;font-weight:800;letter-spacing:1.5px;color:#7f93b8;
  text-transform:uppercase;margin-top:2px}
</style>
</head>
<body>
<div id="app">
  <video id="cam" autoplay playsinline muted></video>
  <div id="fallbackBg"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="ar-frame"><i></i><i></i><i></i><i></i></div>

  <div id="stage"></div>
  <canvas id="fx"></canvas>

  <!-- HUD -->
  <div class="hud ui" id="hud" style="display:none">
    <div class="hud-left">
      <div class="pill"><span class="ic" id="ballIcon"></span><b id="ballCount">25</b></div>
    </div>
    <div class="hud-right">
      <div class="pill"><span style="font-size:15px">⭐</span><b id="score">0</b></div>
      <div class="pill dex" id="dexBtn"><span style="font-size:15px">📖</span><span id="dexCount">0 / 6</span></div>
    </div>
  </div>

  <div id="toast"></div>

  <div id="banner">
    <div class="b-art" id="bannerArt"></div>
    <div class="b-title">Đã thu phục</div>
    <div class="b-name" id="bannerName">—</div>
    <div class="b-pts" id="bannerPts">+100</div>
  </div>

  <!-- START -->
  <div class="overlay" id="start">
    <div class="logo">POKÉLENS</div>
    <div class="sub">Augmented Reality</div>
    <div class="hero-ball" id="heroBall"></div>
    <div class="desc">
      Đưa camera quanh khu vực của bạn.<br>
      <b>Chạm vào Pokémon</b> để ném bóng thu phục chúng!
    </div>
    <button class="btn" id="startBtn">BẮT ĐẦU</button>
    <div class="tips">
      <div><span class="k">◎</span> Chạm chính xác để tăng tỉ lệ bắt</div>
      <div><span class="k">✦</span> Pokémon hiếm có ánh sáng đặc biệt</div>
      <div><span class="k">◈</span> Mở Pokédex để xem bộ sưu tập</div>
    </div>
  </div>

  <!-- DEX -->
  <div class="overlay hidden" id="dex">
    <div class="sheet">
      <div class="head">
        <h2>Pokédex<small>Bộ sưu tập của bạn</small></h2>
        <button class="closeBtn" id="dexClose">✕</button>
      </div>
      <div class="dex-stats">
        <div class="stat"><div class="v" id="stCaught">0</div><div class="l">Đã bắt</div></div>
        <div class="stat"><div class="v" id="stAcc">0%</div><div class="l">Chính xác</div></div>
        <div class="stat"><div class="v" id="stScore">0</div><div class="l">Điểm</div></div>
      </div>
      <div id="dexGrid"></div>
    </div>
  </div>
</div>

<script>
"use strict";
/* =========================================================
   POKÉLENS AR  —  Camera Pokémon Catching Game
   ========================================================= */

/* ---------- SHORTHANDS ---------- */
const $  = s => document.querySelector(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const rand = (a,b) => a + Math.random()*(b-a);
const randInt = (a,b) => Math.floor(rand(a,b+1));
const dist = (x1,y1,x2,y2) => Math.hypot(x2-x1, y2-y1);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

let W = innerWidth, H = innerHeight;
const DPR = Math.min(2, window.devicePixelRatio || 1);

/* ---------- DOM ---------- */
const app      = $('#app');
const cam      = $('#cam');
const stage    = $('#stage');
const fxCanvas = $('#fx');
const fxCtx    = fxCanvas.getContext('2d');

/* =========================================================
   AUDIO ENGINE (Web Audio API — không cần file ngoài)
   ========================================================= */
let actx = null;
function audioInit(){
  if(!actx){
    try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; }
  }
  if(actx && actx.state === 'suspended') actx.resume();
}
function tone({f1=440, f2=null, dur=.15, type='sine', vol=.14, delay=0}){
  if(!actx) return;
  const t0 = actx.currentTime + delay;
  const osc = actx.createOscillator();
  const g   = actx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(f1, t0);
  if(f2 !== null && f2 !== f1){
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t0 + dur);
  }
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(actx.destination);
  osc.start(t0); osc.stop(t0 + dur + .04);
}
function noiseWhoosh(dur=.35, vol=.1){
  if(!actx) return;
  const len = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2);
  const src = actx.createBufferSource(); src.buffer = buf;
  const flt = actx.createBiquadFilter();
  flt.type = 'bandpass'; flt.Q.value = 1.4;
  const t0 = actx.currentTime;
  flt.frequency.setValueAtTime(500, t0);
  flt.frequency.exponentialRampToValueAtTime(2400, t0 + dur);
  const g = actx.createGain(); g.gain.value = vol;
  src.connect(flt); flt.connect(g); g.connect(actx.destination);
  src.start(t0); src.stop(t0 + dur);
}
const sfx = {
  throw(){ noiseWhoosh(.32,.09); tone({f1:520,f2:920,dur:.22,type:'triangle',vol:.06}); },
  hit(){ tone({f1:260,f2:90,dur:.13,type:'square',vol:.16}); tone({f1:900,f2:400,dur:.1,type:'sine',vol:.08}); },
  suck(){ tone({f1:1100,f2:180,dur:.38,type:'sine',vol:.13}); },
  shake(){ tone({f1:420,f2:280,dur:.09,type:'square',vol:.1}); },
  success(){
    [523,659,784,1047].forEach((f,i)=> tone({f1:f,dur:.3,type:'triangle',vol:.14,delay:i*.1}));
    tone({f1:1319,dur:.6,type:'sine',vol:.09,delay:.42});
  },
  fail(){ tone({f1:300,f2:110,dur:.42,type:'sawtooth',vol:.13}); },
  spawn(){ tone({f1:680,f2:1080,dur:.14,type:'sine',vol:.05}); },
  empty(){ tone({f1:180,f2:120,dur:.18,type:'square',vol:.1}); }
};

/* =========================================================
   SPECIES DATA
   ========================================================= */
const SPECIES = [
  { id:'leafasaur', name:'Leafasaur', type:'Cỏ',   rate:.82, weight:30, rarity:1,
    body:'#7dd95e', light:'#c2f5a6', accent:'#2f8f3f', feature:'leaf',  aura:'rgba(120,230,120,.28)' },
  { id:'emberpup',  name:'Emberpup',  type:'Lửa',  rate:.72, weight:23, rarity:1,
    body:'#ff8f52', light:'#ffd0a6', accent:'#e0391d', feature:'flame', aura:'rgba(255,150,80,.28)' },
  { id:'aquafin',   name:'Aquafin',   type:'Nước', rate:.76, weight:22, rarity:1,

const TOTAL_WEIGHT = SPECIES.reduce((a,s)=>a+s.weight, 0);

function pickSpecies(){
  let r = Math.random() * TOTAL_WEIGHT;
  for(const s of SPECIES){ r -= s.weight; if(r <= 0) return s; }
  return SPECIES[0];
}

/* =========================================================
   CANVAS / PARTICLES
   ========================================================= */
let particles = [];
function resizeCanvas(){
  fxCanvas.width  = Math.floor(W * DPR);
  fxCanvas.height = Math.floor(H * DPR);
  fxCanvas.style.width  = W + 'px';
  fxCanvas.style.height = H + 'px';
  fxCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
function spawnParticles(x, y, opts = {}){
  const {
    count = 22, colors = ['#ffd76a','#fff3b0','#ffb020','#ffffff'],
    speed = 260, life = .9, size = 4, gravity = 420, spread = Math.PI*2, angle = 0
  } = opts;
  for(let i=0;i<count;i++){
    const a = angle + (Math.random() - .5) * spread;
    const sp = speed * rand(.35, 1);
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: life * rand(.6, 1.25),
      max: life * 1.25,
      size: size * rand(.55, 1.35),
      color: colors[randInt(0, colors.length-1)],
      gravity,
      rot: rand(0, Math.PI*2),
      vr: rand(-9, 9),
      shape: Math.random() < .35 ? 'star' : 'dot'
    });
  }
}
function updateParticles(dt){
  fxCtx.clearRect(0, 0, W, H);
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dt;
    if(p.life <= 0){ particles.splice(i,1); continue; }
    p.vy += p.gravity * dt;
    p.vx *= (1 - 1.6*dt);
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.vr * dt;

    const alpha = clamp(p.life / p.max, 0, 1);
    fxCtx.save();
    fxCtx.globalAlpha = alpha;
    fxCtx.translate(p.x, p.y);
    fxCtx.rotate(p.rot);
    fxCtx.fillStyle = p.color;
    if(p.shape === 'star'){
      fxCtx.beginPath();
      const R = p.size * 2.1, r = p.size * .82;
      for(let k=0;k<10;k++){
        const rad = (k % 2 === 0) ? R : r;
        const ang = (Math.PI / 5) * k - Math.PI/2;
        const px = Math.cos(ang) * rad, py = Math.sin(ang) * rad;
        k === 0 ? fxCtx.moveTo(px, py) : fxCtx.lineTo(px, py);
      }
      fxCtx.closePath(); fxCtx.fill();
    }else{
      fxCtx.beginPath();
      fxCtx.arc(0, 0, p.size, 0, Math.PI*2);
      fxCtx.fill();
    }
    fxCtx.restore();
  }
}

/* =========================================================
   MAIN LOOP
   ========================================================= */
let lastT = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - lastT) / 1000);
  lastT = now;

  if(G.running){
    /* spawn timer */
    G.spawnTimer -= dt;
    if(G.spawnTimer <= 0){
      G.spawnTimer = rand(1.7, 3.4);
      spawnCreature();
    }

    /* creatures */
    for(let i = mons.length - 1; i >= 0; i--){
      const m = mons[i];
      if(!m.alive){ mons.splice(i,1); continue; }
      if(m.busy) continue;

      m.t += dt;

      /* wander */
      if(m.t > m.nextTurn){
        m.nextTurn = m.t + rand(1.3, 2.9);
        const a = rand(0, Math.PI*2);
        const s = rand(12, 40);
        m.vx = Math.cos(a) * s;
        m.vy = Math.sin(a) * s;
      }
      m.x += m.vx * dt;
      m.y += m.vy * dt;

      /* bounds */
      const minX = 8, maxX = W - 108;
      const minY = 108, maxY = H * 0.70;
      if(m.x < minX){ m.x = minX; m.vx = Math.abs(m.vx); }
      if(m.x > maxX){ m.x = maxX; m.vx = -Math.abs(m.vx); }
      if(m.y < minY){ m.y = minY; m.vy = Math.abs(m.vy); }
      if(m.y > maxY){ m.y = maxY; m.vy = -Math.abs(m.vy); }

      m.cx = m.x + 50;
      m.cy = m.y + 50;
      m.el.style.transform = `translate3d(${m.x.toFixed(1)}px, ${m.y.toFixed(1)}px, 0)`;

      /* flee */
      if(m.t > m.fleeAt){
        m.alive = false;
        m.el.classList.add('fleeing');
        const el = m.el;
        setTimeout(()=> el.remove(), 760);
      }
    }
  }

  updateParticles(dt);
  requestAnimationFrame(loop);
}

/* =========================================================
   BALL FLIGHT
   ========================================================= */
function flyBall(sx, sy, tx, ty, dur = 620){
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'ball-wrap';
    const spin = document.createElement('div');
    spin.className = 'ball-spin';
    spin.innerHTML = BALL_SVG;
    wrap.appendChild(spin);
    wrap.style.transform = `translate3d(${sx-22}px, ${sy-22}px, 0)`;
    stage.appendChild(wrap);

    const t0 = performance.now();
    const arc = 110 + Math.hypot(tx - sx, ty - sy) * 0.26;

    function step(now){
      let p = (now - t0) / dur;
      if(p > 1) p = 1;
      const e = p;
      const x = sx + (tx - sx) * e;
      const y = sy + (ty - sy) * e - Math.sin(Math.PI * p) * arc;
      wrap.style.transform = `translate3d(${x-22}px, ${y-22}px, 0)`;
      spin.style.transform = `rotate(${(p * 880).toFixed(0)}deg)`;
      if(p < 1) requestAnimationFrame(step);
      else { spin.style.transform = 'rotate(0deg)'; resolve({ wrap, spin }); }
    }
    requestAnimationFrame(step);
  });
}

function dropBall(wrap, x0, y0, x1, y1, dur = 380){
  return new Promise(resolve => {
    const t0 = performance.now();
    function step(now){
      let p = (now - t0) / dur;
      if(p > 1) p = 1;
      const e = 1 - Math.pow(1 - p, 3);
      const x = x0 + (x1 - x0) * e;
      const y = y0 + (y1 - y0) * e;
      wrap.style.transform = `translate3d(${x-22}px, ${y-22}px, 0)`;
      if(p < 1) requestAnimationFrame(step); else resolve();
    }
    requestAnimationFrame(step);
  });
}

/* =========================================================
   THROW & CATCH
   ========================================================= */
async function doThrow(tx, ty){
  if(!G.running || G.throwing) return;
  if(G.balls <= 0){ sfx.empty(); toast('Hết bóng rồi! Chờ nhận thêm nhé'); return; }

  G.throwing = true;
  G.balls--;
  G.throws++;
  updateHUD();

  const sx = W / 2;
  const sy = H + 30;

  sfx.throw();

  /* aim marker */
  const mark = document.createElement('div');
  mark.style.cssText = `position:absolute;left:${tx}px;top:${ty}px;width:8px;height:8px;
    margin:-4px 0 0 -4px;border-radius:50%;background:rgba(150,235,255,.95);
    box-shadow:0 0 16px rgba(150,235,255,.9);pointer-events:none;z-index:9;
    transition:opacity .3s, transform .3s;`;
  stage.appendChild(mark);
  requestAnimationFrame(()=>{
    mark.style.transform = 'scale(3.2)';
    mark.style.opacity = '0';
  });
  setTimeout(()=> mark.remove(), 420);

  const { wrap, spin } = await flyBall(sx, sy, tx, ty);

  /* collision check */
  let target = null, bestD = Infinity;
  for(const m of mons){
    if(!m.alive || m.busy) continue;
    const d = dist(tx, ty, m.cx, m.cy);
    if(d < 64 && d < bestD){ bestD = d; target = m; }
  }

  if(!target){
    /* missed — ball falls to the ground */
    const groundY = H - 90 - Math.random() * 70;
    spin.style.transform = 'rotate(0deg)';
    await dropBall(wrap, tx, ty, tx + rand(-20,20), groundY, 460);
    spawnParticles(tx, groundY, { count:10, colors:['#9fb2cc','#6b7a94'], speed:140, life:.5, size:2.6 });
    wrap.style.transition = 'opacity .3s';
    wrap.style.opacity = '0';
    setTimeout(()=> wrap.remove(), 320);
    G.throwing = false;
    return;
  }

  G.hits++;
  await catchSequence(target, wrap, spin, tx, ty);
  G.throwing = false;
}

async function catchSequence(mon, wrap, spin, tx, ty){
  mon.busy = true;
  const cx = mon.cx, cy = mon.cy;

  /* move ball exactly onto creature */
  wrap.style.transform = `translate3d(${cx-22}px, ${cy-22}px, 0)`;
  spin.style.transform = 'rotate(0deg)';

  sfx.hit();
  spawnParticles(cx, cy, {
    count:16, colors:['#ffffff','#bfe9ff','#8fd7ff'],
    speed:340, life:.4, size:3.2, gravity:120
  });

  /* white flash */
  const flash = document.createElement('div');
  flash.style.cssText = `position:absolute;left:${cx}px;top:${cy}px;width:150px;height:150px;
    margin:-75px 0 0 -75px;border-radius:50%;pointer-events:none;z-index:9;
    background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(180,235,255,.5) 35%, transparent 70%);
    animation:ringOut .42s ease-out forwards;`;
  stage.appendChild(flash);
  setTimeout(()=> flash.remove(), 450);

  await wait(150);

  /* suck creature into ball */
  sfx.suck();
  mon.el.classList.add('sucked');
  await wait(340);

  mon.alive = false;
  mon.el.remove();

  /* ball drops to ground */
  const groundY = clamp(H - 110 - Math.random()*60, H*0.6, H - 70);
  const bounceX = cx + rand(-24, 24);
  spin.classList.add('pop');
  await wait(180);
  await dropBall(wrap, cx, cy, bounceX, groundY, 400);
  spin.classList.remove('pop');

  /* ---- calculate catch ---- */
  const perfect = dist(tx, ty, cx, cy) < 30;
  let rate = mon.sp.rate + (perfect ? 0.16 : 0);
  rate = clamp(rate, 0.12, 0.94);
  const success = Math.random() < rate;
  const shakes = success ? 3 : randInt(1, 3);

  /* ---- shake sequence ---- */
  for(let i=0;i<shakes;i++){
    sfx.shake();
    spin.classList.add('shake');
    /* tiny positional jitter */
    const jx = bounceX + rand(-5, 5);
    wrap.style.transform = `translate3d(${jx-22}px, ${groundY-22}px, 0)`;
    await wait(520);
    spin.classList.remove('shake');
    await wait(130);
  }

  if(success){
    /* ====== CAUGHT ====== */
    sfx.success();
    spin.classList.add('glow');

    spawnParticles(bounceX, groundY, {
      count:34, colors:['#ffd76a','#fff3b0','#ffb020','#ffffff','#8ef0c0'],
      speed:330, life:1.1, size:4.2, gravity:400
    });
    spawnParticles(bounceX, groundY, {
      count:14, colors:['#ffffff','#bfe9ff'],
      speed:180, life:1.4, size:3, gravity:-40
    });

    /* dex + score */
    G.caught[mon.sp.id] = (G.caught[mon.sp.id] || 0) + 1;
    const pts = mon.sp.rarity === 3 ? 500 : mon.sp.rarity === 2 ? 250 : 100;
    const bonus = perfect ? Math.round(pts * 0.25) : 0;
    G.score += pts + bonus;

    /* reward balls */
    const reward = mon.sp.rarity === 3 ? 4 : mon.sp.rarity === 2 ? 2 : 1;
    G.balls += reward;

    updateHUD();
    showBanner(mon.sp, pts + bonus);
    if(perfect) toast('✦ Ném hoàn hảo! +25% điểm');

    await wait(900);

    /* ball fades away */
    wrap.style.transition = 'opacity .5s, transform .5s';
    wrap.style.opacity = '0';
    const fy = groundY - 40;
    wrap.style.transform = `translate3d(${bounceX-22}px, ${fy-22}px, 0)`;
    setTimeout(()=> wrap.remove(), 520);

  }else{
    /* ====== BROKE FREE ====== */
    sfx.fail();
    spin.classList.add('burst');

    spawnParticles(bounceX, groundY, {
      count:20, colors:['#ffffff','#ff8080','#ffd76a'],
      speed:300, life:.6, size:3.4, gravity:520
    });

    await wait(220);
    wrap.remove();

    /* creature reappears & flees */
    const scale = rand(.86, 1.16);
    const el = document.createElement('div');
    el.className = 'mon';
    if(mon.sp.rarity >= 2){
      el.classList.add('rare');
      el.style.setProperty('--aura', mon.sp.aura);
    }
    el.innerHTML = `
      <div class="mon-anim">
        <div class="mon-float">
          ${creatureSVG(mon.sp).replace('style="transform-origin:50% 50%"',
            `style="transform-origin:50% 50%;transform:scale(${scale.toFixed(3)})"`)}
        </div>
      </div>`;
    const rx = clamp(bounceX - 50, 8, W - 108);
    const ry = clamp(groundY - 90, 108, H*0.70);
    el.style.transform = `translate3d(${rx}px, ${ry}px, 0)`;
    stage.appendChild(el);

    spawnParticles(bounceX, groundY - 40, {
      count:12, colors:['#ffffff','#bfe9ff'],
      speed:200, life:.5, size:3, gravity:200
    });

    await wait(600);
    el.classList.add('fleeing');
    setTimeout(()=> el.remove(), 760);

    toast('Ôi không! Nó thoát ra rồi!');
  }

  /* refill if out of balls */
  if(G.balls <= 0){
    await wait(500);
    G.balls += 8;
    updateHUD();
    toast('🎁 Nhận thêm 8 bóng!');
  }
}

        <div class="art">${creatureSVG(sp)}</div>
        <div class="nm">${known ? sp.name : '???'}</div>
        <div class="tp">${known ? sp.type : '— — —'}</div>
      </div>`;
  }).join('');

  const totalCaught = Object.values(G.caught).reduce((a,b)=>a+b, 0);
  $('#stCaught').textContent = totalCaught;
  $('#stAcc').textContent = G.throws ? Math.round(G.hits / G.throws * 100) + '%' : '0%';
  $('#stScore').textContent = G.score;
}

/* =========================================================
   CAMERA
   ========================================================= */
async function initCamera(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return false;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width:  { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });
    cam.srcObject = stream;
    await cam.play();
    document.body.classList.add('has-cam');
    return true;
  }catch(err){
    console.warn('Không truy cập được camera:', err);
    return false;
  }
}

/* =========================================================
   INPUT
   ========================================================= */
function onPointerDown(e){
  if(!G.running) return;
  if(e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
  if(e.target.closest('.ui')) return;
  if(e.target.closest('.overlay')) return;

  const rect = stage.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  /* don't throw right at the HUD area */
  if(y < 74) return;
  /* don't throw at the very bottom edge */
  if(y > H - 8) return;

  doThrow(x, y);
}

/* =========================================================
   RESIZE
   ========================================================= */
function onResize(){
  W = innerWidth; H = innerHeight;
  resizeCanvas();
  for(const m of mons){
    if(!m.alive) continue;
    m.x = clamp(m.x, 8, W - 108);
    m.y = clamp(m.y, 108, H * 0.70);
    m.cx = m.x + 50; m.cy = m.y + 50;
    m.el.style.transform = `translate3d(${m.x}px, ${m.y}px, 0)`;
  }
}

/* =========================================================
   BOOT
   ========================================================= */
function boot(){
  /* icons */
  $('#ballIcon').innerHTML = BALL_SVG;
  $('#heroBall').innerHTML = BALL_SVG;

  resizeCanvas();
  updateHUD();
  renderDex();

  /* events */
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', ()=> setTimeout(onResize, 220));
  app.addEventListener('pointerdown', onPointerDown, { passive: true });

  $('#dexBtn').addEventListener('click', ()=>{
    audioInit();
    renderDex();
    $('#dex').classList.remove('hidden');
  });
  $('#dexClose').addEventListener('click', ()=>{
    $('#dex').classList.add('hidden');
  });

  $('#startBtn').addEventListener('click', async ()=>{
    audioInit();
    const btn = $('#startBtn');
    btn.textContent = 'ĐANG KẾT NỐI...';
    btn.disabled = true;

    const ok = await initCamera();

    $('#start').classList.add('hidden');
    $('#hud').style.display = 'flex';
    G.running = true;
    G.spawnTimer = .6;
    lastT = performance.now();

    if(!ok){
      toast('Không có camera — chế độ mô phỏng');
    }else{
      toast('Camera đã sẵn sàng! Chạm để ném bóng');
    }

    /* initial spawns */
    setTimeout(()=> spawnCreature(), 300);
    setTimeout(()=> spawnCreature(), 1400);
  });

  /* prevent context menu / double-tap zoom */
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());

  requestAnimationFrame(loop);
}

boot();
</script>
