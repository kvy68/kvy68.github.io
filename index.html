<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gửi Khánh Vy 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF4EC;
    --paper:#FFFCF7;
    --rose:#D9A6AE;
    --rose-deep:#C07E8C;
    --sage:#AEB894;
    --plum:#4A3A42;
    --gold:#C9A166;
    --ink:#5B4650;
    --blue:#5B8DEF;
    --blue-soft:#BFD7FF;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    background:var(--cream);
    font-family:'Quicksand',sans-serif;
    color:var(--ink);
    overflow-x:hidden;
  }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:24px;
  }

  /* ambient background wash */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(217,166,174,0.25), transparent 55%),
      radial-gradient(ellipse at 85% 80%, rgba(174,184,148,0.22), transparent 55%),
      radial-gradient(ellipse at 90% 10%, rgba(201,161,102,0.15), transparent 45%);
    pointer-events:none;
    z-index:0;
  }

  /* floating petals */
  .petals{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
    overflow:hidden;
  }
  .petal{
    position:absolute;
    top:-5%;
    font-size:18px;
    opacity:0.75;
    animation:fall linear infinite;
    filter:hue-rotate(0deg);
  }
  .petal.blue{
    color:var(--blue);
    text-shadow:0 0 6px rgba(91,141,239,0.35);
  }
  @keyframes fall{
    0%{ transform:translateY(-10vh) translateX(0) rotate(0deg); opacity:0; }
    8%{ opacity:0.8; }
    92%{ opacity:0.6; }
    100%{ transform:translateY(110vh) translateX(var(--drift,40px)) rotate(320deg); opacity:0; }
  }

  .stage{
    position:relative;
    z-index:2;
    width:100%;
    max-width:520px;
  }

  /* ---------- ENVELOPE ---------- */
  .envelope-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
    animation:riseIn 1.1s ease both;
  }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(24px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .prompt-text{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.15rem;
    color:var(--rose-deep);
    letter-spacing:0.02em;
    text-align:center;
  }

  .envelope{
    position:relative;
    width:min(78vw, 320px);
    height:min(78vw, 320px);
    aspect-ratio:1/1;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }

  .env-shell{
    position:absolute;
    inset:0;
    top:18%;
    height:82%;
    border-radius:6px;
    box-shadow:
      0 18px 40px -12px rgba(74,58,66,0.35),
      0 2px 0 rgba(255,255,255,0.6) inset;
  }

  .env-clip{
    position:absolute;
    inset:0;
    overflow:hidden;
    border-radius:6px;
  }

  .env-body{
    position:absolute;
    inset:0;
    background:linear-gradient(160deg, #FEFAF4, #F3E4E3);
  }

  .env-body::after{ /* bottom V shading */
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:65%;
    background:
      linear-gradient(135deg, transparent 49.3%, rgba(74,58,66,0.06) 50%, transparent 50.7%),
      linear-gradient(225deg, transparent 49.3%, rgba(74,58,66,0.06) 50%, transparent 50.7%);
  }

  .env-flap{
    position:absolute;
    top:0; left:0; right:0;
    height:46%;
    background:linear-gradient(160deg, #F6E7E6, #EBD3D5);
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    transform-origin:top center;
    transition:transform 0.9s cubic-bezier(.6,-0.1,.25,1.2);
    z-index:3;
    box-shadow:0 1px 0 rgba(255,255,255,0.4) inset;
  }

  .seal{
    position:absolute;
    top:38%;
    left:50%;
    transform:translate(-50%,-50%);
    width:58px;
    height:58px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #D6A9AC, var(--rose-deep) 70%);
    box-shadow:0 6px 14px rgba(74,58,66,0.35), 0 0 0 2px rgba(255,255,255,0.15) inset;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.3rem;
    color:#fff;
    z-index:5;
    transition:transform 0.4s ease, opacity 0.4s ease;
  }
  .envelope:hover .seal{ transform:translate(-50%,-50%) scale(1.06); }

  .letter-peek{
    position:absolute;
    left:6%;
    right:6%;
    bottom:7%;
    top:5%;
    background:var(--paper);
    border-radius:4px;
    box-shadow:0 -6px 18px -6px rgba(74,58,66,0.15);
    transform:translateY(92%);
    transition:transform 1s cubic-bezier(.5,0,.2,1) 0.15s;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding-top:18px;
  }
  .letter-peek span{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    color:var(--rose-deep);
    font-size:0.95rem;
    opacity:0;
    transition:opacity 0.4s ease 0.6s;
  }

  .envelope.open .env-flap{ transform:rotateX(180deg); }
  .envelope.open .seal{ opacity:0; transform:translate(-50%,-50%) scale(0.6); }
  .envelope.open .letter-peek{ transform:translateY(18%); }
  .envelope.open .letter-peek span{ opacity:1; }

  .hint{
    font-size:0.85rem;
    color:var(--ink);
    opacity:0.55;
    letter-spacing:0.04em;
  }

  .twinkle{
    position:absolute;
    color:var(--blue);
    font-size:1rem;
    animation:twinkle 2.4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.25; transform:scale(0.8); }
    50%{ opacity:1; transform:scale(1.15); }
  }

  /* ---------- LETTER (revealed) ---------- */
  .letter-scene{
    display:none;
    width:100%;
    animation:letterIn 1s cubic-bezier(.2,.7,.2,1) both;
  }
  .letter-scene.show{ display:block; }
  @keyframes letterIn{
    from{ opacity:0; transform:translateY(36px) scale(0.97); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .letter-card{
    position:relative;
    background:var(--paper);
    border-radius:14px;
    padding:44px 34px 38px;
    box-shadow:
      0 30px 60px -20px rgba(74,58,66,0.35),
      0 2px 0 rgba(255,255,255,0.7) inset;
    border:1px solid rgba(201,161,102,0.25);
  }

  .letter-card::before{
    content:"✦ ✧ ✦";
    position:absolute;
    top:16px; left:50%;
    transform:translateX(-50%);
    color:var(--blue);
    font-size:0.8rem;
    letter-spacing:0.4em;
  }

  .eyebrow{
    text-align:center;
    font-size:0.72rem;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--blue);
    margin-bottom:6px;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-style:italic;
    text-align:center;
    font-size:clamp(1.9rem, 7vw, 2.6rem);
    color:var(--rose-deep);
    line-height:1.2;
    margin-bottom:4px;
  }

  .divider{
    width:64px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--blue), transparent);
    margin:18px auto 22px;
  }

  /* typewriter lines */
  .type-line{ min-height:1.2em; }
  .typing-cursor{
    display:inline-block;
    width:2px;
    height:1em;
    background:var(--blue);
    margin-left:2px;
    vertical-align:-0.15em;
    animation:blink 0.8s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .body-text{
    font-size:1rem;
    line-height:1.85;
    color:var(--ink);
    letter-spacing:0.01em;
  }
  .body-text p{ margin-bottom:16px; }
  .body-text p:last-of-type{ margin-bottom:0; }

  .signoff{
    margin-top:26px;
    text-align:right;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.15rem;
    color:var(--rose-deep);
  }

  .cake-stage{
    text-align:center;
    margin-top:30px;
    opacity:0;
    transform:translateY(16px);
    transition:opacity 0.8s ease, transform 0.8s ease;
  }
  .cake-stage.visible{
    opacity:1;
    transform:translateY(0);
  }

  .cake-visual{
    position:relative;
    display:inline-flex;
    align-items:flex-end;
    justify-content:center;
    height:66px;
    margin-bottom:10px;
  }

  .flame{
    position:absolute;
    top:-8px;
    left:50%;
    font-size:1.05rem;
    transform-origin:bottom center;
    transform:translateX(-50%) scale(1) rotate(-2deg);
    animation:flicker 1.4s ease-in-out infinite;
    filter:drop-shadow(0 0 6px rgba(255,170,60,0.6));
  }
  @keyframes flicker{
    0%,100%{ transform:translateX(-50%) scale(1) rotate(-3deg); }
    50%{ transform:translateX(-50%) scale(1.15) rotate(3deg); }
  }
  .flame.blown{
    animation:none;
    transition:opacity 0.5s ease, transform 0.5s ease;
    opacity:0;
    transform:translateX(-50%) translateY(-18px) scale(0.3);
  }

  .smoke{
    position:absolute;
    top:-8px;
    left:50%;
    font-size:0.9rem;
    color:#c9c2ba;
    opacity:0.8;
    animation:smokeUp 1.2s ease-out forwards;
    pointer-events:none;
  }
  @keyframes smokeUp{
    0%{ transform:translate(-50%,0) scale(0.6); opacity:0.8; }
    100%{ transform:translate(-50%,-38px) scale(1.3); opacity:0; }
  }

  .candle-btn{
    background:none;
    border:1px solid rgba(192,126,140,0.4);
    color:var(--rose-deep);
    font-family:'Quicksand',sans-serif;
    font-weight:500;
    font-size:0.85rem;
    letter-spacing:0.04em;
    padding:10px 20px;
    border-radius:999px;
    cursor:pointer;
    transition:all 0.3s ease;
  }
  .candle-btn:hover{
    background:var(--blue);
    border-color:var(--blue);
    color:#fff;
    box-shadow:0 8px 20px -8px rgba(91,141,239,0.55);
  }

  .cake-emoji{
    position:relative;
    font-size:2.6rem;
    filter:drop-shadow(0 6px 10px rgba(74,58,66,0.2));
    transition:transform 0.3s ease;
  }
  .cake-emoji.blown{
    animation:cakePop 0.9s cubic-bezier(.36,1.6,.5,1) both;
  }
  @keyframes cakePop{
    0%{ transform:scale(1) rotate(0deg); filter:drop-shadow(0 6px 10px rgba(74,58,66,0.2)); }
    30%{ transform:scale(1.35) rotate(-8deg); filter:drop-shadow(0 10px 18px rgba(91,141,239,0.45)); }
    55%{ transform:scale(0.92) rotate(6deg); }
    75%{ transform:scale(1.12) rotate(-3deg); }
    100%{ transform:scale(1) rotate(0deg); filter:drop-shadow(0 6px 14px rgba(91,141,239,0.35)); }
  }

  .celebrate-msg{
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    color:var(--blue);
    font-size:0.95rem;
    margin-top:12px;
    height:1.2em;
    opacity:0;
    transition:opacity 0.5s ease;
  }
  .celebrate-msg.show{ opacity:1; }

  /* confetti hearts burst */
  .burst{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
  }
  .heart-bit{
    position:absolute;
    font-size:1.2rem;
    opacity:0.9;
    animation:burstUp 1.4s ease-out forwards;
  }
  @keyframes burstUp{
    0%{ transform:translate(0,0) scale(0.6) rotate(0deg); opacity:1; }
    100%{ transform:translate(var(--bx,0), var(--by,-160px)) scale(1) rotate(var(--br,180deg)); opacity:0; }
  }

  @media (max-width:420px){
    .letter-card{ padding:36px 22px 30px; }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="petals" id="petals"></div>

<div class="stage">

  <!-- envelope stage -->
  <div class="envelope-wrap" id="envelopeWrap">
    <p class="prompt-text">Có một lá thư nhỏ đang đợi em...</p>
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Mở thư chúc mừng sinh nhật">
      <span class="twinkle" style="top:-6%; left:-4%; animation-delay:0s;">✦</span>
      <span class="twinkle" style="top:8%; right:-8%; font-size:0.75rem; animation-delay:0.8s;">✧</span>
      <span class="twinkle" style="bottom:2%; left:-10%; font-size:0.7rem; animation-delay:1.5s;">✦</span>
      <div class="env-shell">
        <div class="env-clip">
          <div class="env-body"></div>
          <div class="letter-peek"><span>gửi Khánh Vy</span></div>
        </div>
      </div>
      <div class="env-flap"></div>
      <div class="seal">KV</div>
    </div>
    <p class="hint">chạm vào con dấu để mở thư 💌</p>
  </div>

  <!-- letter content -->
  <div class="letter-scene" id="letterScene">
    <div class="letter-card">
      <p class="eyebrow">Một ngày đặc biệt</p>
      <h1 class="type-line" id="typeTitle" data-text="🎂 Chúc mừng sinh nhật Khánh Vy! 🎉"></h1>
      <div class="divider"></div>
      <div class="body-text">
        <p class="type-line" data-text="Hôm nay là một ngày rất đặc biệt, nên anh chỉ muốn gửi đến em những điều tốt đẹp nhất."></p>
        <p class="type-line" data-text="Chúc em luôn mạnh khỏe, vui vẻ và mỗi ngày đều có thật nhiều nụ cười. Mong rằng những điều em đang cố gắng sẽ dần trở thành hiện thực, việc học thuận lợi, cuộc sống gặp nhiều may mắn và luôn có những người thật lòng yêu thương, trân trọng em."></p>
        <p class="type-line" data-text="Cảm ơn em vì đã từng xuất hiện trong cuộc sống của anh. Dù hiện tại mọi thứ có như thế nào đi nữa, anh vẫn thật lòng mong em luôn hạnh phúc."></p>
        <p class="type-line" data-text="Hy vọng tuổi mới sẽ mang đến cho em thật nhiều điều đẹp đẽ, những trải nghiệm đáng nhớ và những khoảnh khắc khiến em mỉm cười."></p>
        <p class="type-line" data-text="Chúc mừng sinh nhật em! ❤️"></p>
      </div>

      <div class="cake-stage" id="cakeStage">
        <div class="cake-visual">
          <span class="flame" id="flame">🔥</span>
          <span class="cake-emoji" id="cakeEmoji">🎂</span>
        </div>
        <button class="candle-btn" id="blowBtn">thổi nến chúc phúc 🕯️</button>
        <p class="celebrate-msg" id="celebrateMsg">điều ước của em nhất định sẽ thành hiện thực ✨</p>
      </div>
    </div>
  </div>

</div>

<div class="burst" id="burst"></div>

<script>
  // ambient falling petals + blue sparkles (her favorite color)
  const petalChars = ['🌸','✿','❀','🌷'];
  const blueChars = ['✦','✧','⋆','✩'];
  const petalHost = document.getElementById('petals');
  const PETAL_COUNT = 18;
  for(let i=0;i<PETAL_COUNT;i++){
    const p = document.createElement('div');
    const isBlue = i % 3 === 0; // roughly 1 in 3 are blue sparkles
    p.className = isBlue ? 'petal blue' : 'petal';
    p.textContent = isBlue
      ? blueChars[Math.floor(Math.random()*blueChars.length)]
      : petalChars[Math.floor(Math.random()*petalChars.length)];
    p.style.left = Math.random()*100 + 'vw';
    p.style.setProperty('--drift', (Math.random()*80-40)+'px');
    p.style.animationDuration = (10 + Math.random()*10) + 's';
    p.style.animationDelay = (Math.random()*12) + 's';
    p.style.fontSize = (12 + Math.random()*10) + 'px';
    petalHost.appendChild(p);
  }

  // envelope open interaction
  const envelope = document.getElementById('envelope');
  const envelopeWrap = document.getElementById('envelopeWrap');
  const letterScene = document.getElementById('letterScene');

  function openEnvelope(){
    if(envelope.classList.contains('open')) return;
    envelope.classList.add('open');
    setTimeout(()=>{
      envelopeWrap.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
      envelopeWrap.style.opacity = '0';
      envelopeWrap.style.transform = 'translateY(-12px) scale(0.96)';
      setTimeout(()=>{
        envelopeWrap.style.display = 'none';
        letterScene.classList.add('show');
        setTimeout(prepareAndType, 650);
      }, 550);
    }, 950);
  }

  // measure the full letter at real size first, lock that height,
  // then clear the text and only start typing — so the card never resizes
  function prepareAndType(){
    const card = document.querySelector('.letter-card');
    const lines = Array.from(document.querySelectorAll('.type-line'));

    lines.forEach(el => { el.textContent = el.getAttribute('data-text') || ''; });
    void card.offsetHeight; // force reflow
    const fullHeight = card.getBoundingClientRect().height;
    card.style.minHeight = fullHeight + 'px';

    lines.forEach(el => { el.textContent = ''; });
    startTyping();
  }

  // typewriter effect, line by line, for a little surprise reveal
  function typeLine(el, text, speed, callback){
    let i = 0;
    const cursor = document.createElement('span');
    cursor.className = 'typing-cursor';
    el.appendChild(cursor);
    (function step(){
      if(i < text.length){
        cursor.insertAdjacentText('beforebegin', text[i]);
        i++;
        setTimeout(step, speed);
      } else {
        cursor.remove();
        if(callback) callback();
      }
    })();
  }

  function startTyping(){
    const lines = Array.from(document.querySelectorAll('.type-line'));
    let idx = 0;
    (function next(){
      if(idx >= lines.length){
        const cakeStage = document.getElementById('cakeStage');
        cakeStage.classList.add('visible');
        return;
      }
      const el = lines[idx];
      const text = el.getAttribute('data-text') || '';
      const speed = el.id === 'typeTitle' ? 34 : 16;
      typeLine(el, text, speed, ()=>{
        idx++;
        setTimeout(next, idx === 1 ? 400 : 220);
      });
    })();
  }

  envelope.addEventListener('click', openEnvelope);
  envelope.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openEnvelope(); }
  });

  // blow candle -> flame goes out with smoke, cake pops, hearts + sparkles burst
  const blowBtn = document.getElementById('blowBtn');
  const cakeEmoji = document.getElementById('cakeEmoji');
  const flame = document.getElementById('flame');
  const celebrateMsg = document.getElementById('celebrateMsg');
  const burstHost = document.getElementById('burst');
  let blown = false;

  blowBtn.addEventListener('click', ()=>{
    if(blown) return;
    blown = true;

    // flame goes out + puff of smoke
    flame.classList.add('blown');
    const smoke = document.createElement('span');
    smoke.className = 'smoke';
    smoke.textContent = '💨';
    flame.parentElement.appendChild(smoke);
    setTimeout(()=>smoke.remove(), 1300);

    cakeEmoji.textContent = '🎉';
    cakeEmoji.classList.add('blown');
    celebrateMsg.classList.add('show');
    blowBtn.textContent = 'điều ước đã được gửi đi 🤍';
    blowBtn.disabled = true;

    const hearts = ['💗','💖','🌸','✨','💕','💙','⭐'];
    const rect = blowBtn.getBoundingClientRect();
    for(let i=0;i<26;i++){
      const h = document.createElement('div');
      h.className = 'heart-bit';
      h.textContent = hearts[Math.floor(Math.random()*hearts.length)];
      h.style.left = (rect.left + rect.width/2) + 'px';
      h.style.top = (rect.top) + 'px';
      const bx = (Math.random()*300-150) + 'px';
      const by = -(130 + Math.random()*180) + 'px';
      const br = (Math.random()*360) + 'deg';
      h.style.setProperty('--bx', bx);
      h.style.setProperty('--by', by);
      h.style.setProperty('--br', br);
      h.style.animationDelay = (Math.random()*0.25) + 's';
      burstHost.appendChild(h);
      setTimeout(()=>h.remove(), 1700);
    }
  });
</script>

</body>
</html>
